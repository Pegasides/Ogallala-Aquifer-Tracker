name: Update facility news

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facility-news-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tracker
        uses: actions/checkout@v4
      - name: Verify matching safeguards
        run: python3 scripts/update-facility-news.py --self-test
      - name: Refresh every facility profile
        run: python3 scripts/update-facility-news.py
      - name: Publish only when the feed changed
        run: |
          if git diff --quiet -- data/facility-news.json; then
            echo "No feed change to publish."
            exit 0
          fi
          git config user.name "Ogallala Tracker News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/facility-news.json
          git commit -m "Refresh facility news"
          git push
