name: V3.1 Public Browser Preview Test

on:
  push:
    branches: [version-3.1-working]
    paths:
      - 'v3.html'
      - 'v3-map.html'
      - 'v3-timeline.html'
      - 'groundwater-window.html'
      - 'groundwater-window-core.html'
      - 'sources.html'
      - 'geography.js'
      - 'map-engine.js'
      - 'ChatGPT Image Aug 8, 2026, 10_14_56 AM.png'
      - 'Ogallala_Aquifer_Tracker_Sources_Poster_V3_1_verified.png'
      - 'scripts/v3-1-smoke.mjs'
      - '.github/workflows/v3-1-public-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Version 3.1 commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for public preview proxy
        env:
          PREVIEW_BASE: https://raw.githack.com/Pegasides/Ogallala-Aquifer-Tracker/${{ github.sha }}/
        run: |
          set -euxo pipefail
          ready=0
          for i in $(seq 1 30); do
            if curl -fsSI "${PREVIEW_BASE}v3.html" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsSI "${PREVIEW_BASE}v3.html"
          curl -fsSI "${PREVIEW_BASE}v3-map.html"
          curl -fsSI "${PREVIEW_BASE}groundwater-window.html"
          curl -fsSI "${PREVIEW_BASE}sources.html"
          curl -fsSI "${PREVIEW_BASE}Ogallala_Aquifer_Tracker_Sources_Poster_V3_1_verified.png"

      - name: Run browser checks through public preview URL
        env:
          BASE_URL: https://raw.githack.com/Pegasides/Ogallala-Aquifer-Tracker/${{ github.sha }}/
        run: node scripts/v3-1-smoke.mjs
