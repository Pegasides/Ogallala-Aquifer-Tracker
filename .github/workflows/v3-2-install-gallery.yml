name: V3.2 Install Homepage Artwork Gallery

on:
  push:
    branches:
      - version-3.2-working
    paths:
      - '.v32-gallery-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Version 3.2 working branch
        uses: actions/checkout@v4
        with:
          ref: version-3.2-working
          fetch-depth: 0

      - name: Rebuild and verify homepage artwork package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .v32-gallery-upload/READY ]; then
            echo "Upload marker is absent; nothing to do."
            exit 0
          fi
          cat .v32-gallery-upload/bin-* > /tmp/v3-2-gallery-assets.tar.gz
          test "$(wc -c < /tmp/v3-2-gallery-assets.tar.gz)" -eq 326226
          echo "529c1075a2ed3b8a4b4a1c6c24c3e6f648d912897096bc2e82b65b67708a6f2d  /tmp/v3-2-gallery-assets.tar.gz" | sha256sum -c -
          mkdir -p /tmp/v32-gallery
          tar -xzf /tmp/v3-2-gallery-assets.tar.gz -C /tmp/v32-gallery

          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-aquifer-map.avif)" -eq 49133
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-groundwater-window.avif)" -eq 48732
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-ai-impact.avif)" -eq 82280
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-real-example.avif)" -eq 80051
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-sources.avif)" -eq 65401

          file /tmp/v32-gallery/*.avif
          cp /tmp/v32-gallery/*.avif .

      - name: Commit installed artwork and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .v32-gallery-upload/READY ]; then
            exit 0
          fi
          rm -rf .v32-gallery-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-2-gallery-aquifer-map.avif v3-2-gallery-groundwater-window.avif v3-2-gallery-ai-impact.avif v3-2-gallery-real-example.avif v3-2-gallery-sources.avif .v32-gallery-upload
          git commit -m "Install V3.2 homepage artwork gallery"
          git push origin HEAD:version-3.2-working
