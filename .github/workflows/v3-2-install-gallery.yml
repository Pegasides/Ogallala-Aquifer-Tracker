name: V3.2 Install Homepage Artwork Gallery

on:
  push:
    branches:
      - version-3.2-working
    paths:
      - '.v32-gallery-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Version 3.2 working branch
        uses: actions/checkout@v4
        with:
          ref: version-3.2-working
          fetch-depth: 0

      - name: Rebuild and verify homepage artwork package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .v32-gallery-upload/READY ]; then
            echo "Upload marker is absent; nothing to do."
            exit 0
          fi
          cat .v32-gallery-upload/chunk-* | tr -d '\r\n' | base64 -d > /tmp/v3-2-gallery-assets.tar.gz
          test "$(wc -c < /tmp/v3-2-gallery-assets.tar.gz)" -eq 261131
          echo "f3d7482cd4b93cf300d3f45efef6459e8ad5ae0eca8998bbde79f3ed9e4aa243  /tmp/v3-2-gallery-assets.tar.gz" | sha256sum -c -
          mkdir -p /tmp/v32-gallery
          tar -xzf /tmp/v3-2-gallery-assets.tar.gz -C /tmp/v32-gallery

          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-aquifer-map.avif)" -eq 49133
          echo "1e765bb8c5862802f70f9aeb4e3a97aa55a320aa95a775aa09608561c3c9587a  /tmp/v32-gallery/v3-2-gallery-aquifer-map.avif" | sha256sum -c -
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-groundwater-window.avif)" -eq 48732
          echo "0ee3d95f22524b3f57dce5d62f4344d9346282ae46c6380d6fcfad11cdccda79  /tmp/v32-gallery/v3-2-gallery-groundwater-window.avif" | sha256sum -c -
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-ai-impact.avif)" -eq 82280
          echo "574338675c598cc71426d2cba2f210dcbcf0e7b9b55ff5ead07c12471549184c  /tmp/v32-gallery/v3-2-gallery-ai-impact.avif" | sha256sum -c -
          test "$(wc -c < /tmp/v32-gallery/v3-2-gallery-real-example.avif)" -eq 80051
          echo "000e44f2af505730b3c511f92407bd2ae30e2952f137d45862396bfae19f822f  /tmp/v32-gallery/v3-2-gallery-real-example.avif" | sha256sum -c -

          file /tmp/v32-gallery/*.avif
          cp /tmp/v32-gallery/*.avif .

      - name: Commit installed artwork and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .v32-gallery-upload/READY ]; then
            exit 0
          fi
          rm -rf .v32-gallery-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-2-gallery-aquifer-map.avif v3-2-gallery-groundwater-window.avif v3-2-gallery-ai-impact.avif v3-2-gallery-real-example.avif .v32-gallery-upload
          git commit -m "Install V3.2 homepage artwork gallery"
          git push origin HEAD:version-3.2-working
