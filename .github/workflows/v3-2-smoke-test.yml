name: V3.2 Branch Browser Smoke Test

on:
  push:
    branches:
      - version-3.2-working
    paths:
      - 'v3.html'
      - 'v3-map.html'
      - 'v3-timeline.html'
      - 'map-engine.js'
      - 'groundwater-window.html'
      - 'groundwater-window-core.html'
      - 'v3-my-aquifer.html'
      - 'sources.html'
      - 'data-centers.html'
      - 'scripts/v3-2-smoke.mjs'
      - '.github/workflows/v3-2-smoke-test.yml'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Version 3.2 working branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Version 3.2 browser smoke checks
        env:
          BASE_URL: http://127.0.0.1:8000/
        run: |
          set -euxo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/v3-2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8000/v3.html >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsSI http://127.0.0.1:8000/v3.html
          curl -fsSI http://127.0.0.1:8000/data-centers.html
          curl -fsSI http://127.0.0.1:8000/v3-map.html
          curl -fsSI http://127.0.0.1:8000/groundwater-window.html
          curl -fsSI http://127.0.0.1:8000/v3-my-aquifer.html
          curl -fsSI http://127.0.0.1:8000/sources.html
          node scripts/v3-2-smoke.mjs
