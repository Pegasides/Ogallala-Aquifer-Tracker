<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ogallala Aquifer Tracker — Four-Year Visual Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06131d;color:#f7fbff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 28px}h1{margin:0 0 12px;font-size:clamp(20px,3vw,34px)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}button{border:1px solid #4f6c7d;background:#102b3d;color:#e8f2f6;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}button.active{background:#145a73;border-color:#5eead4;color:#fff}.frame{width:100%;aspect-ratio:3/2;position:relative;overflow:hidden;border:1px solid #3b596c;border-radius:12px;background:#08141d}.sheet{position:absolute;width:200%;height:200%;left:0;top:0;background-image:url('ChatGPT%20Image%20Aug%2015,%202026,%2010_13_39%20AM.png');background-size:100% 100%;background-repeat:no-repeat;transition:transform .18s ease}.y1950 .sheet{transform:translate(0,0)}.y1980 .sheet{transform:translate(-50%,0)}.y2026 .sheet{transform:translate(0,-50%)}.y2050 .sheet{transform:translate(-50%,-50%)}.note{margin-top:10px;color:#a9bdc8;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Ogallala Aquifer Tracker — Four-Year Visual Preview</h1>
<div class="controls">
<button data-year="1950" class="active">1950</button><button data-year="1980">1980</button><button data-year="2026">2026</button><button data-year="2050">2050</button>
</div>
<div id="frame" class="frame y1950"><div class="sheet"></div></div>
<div class="note">Preview only — click the four anchor years to review the new artwork.</div>
</div>
<script>
const frame=document.getElementById('frame');document.querySelectorAll('button[data-year]').forEach(btn=>btn.addEventListener('click',()=>{const y=btn.dataset.year;frame.className='frame y'+y;document.querySelectorAll('button[data-year]').forEach(b=>b.classList.toggle('active',b===btn));}));
</script>
</body>
</html>
