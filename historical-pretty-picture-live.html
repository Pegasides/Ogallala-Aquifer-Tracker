<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical Pretty Picture Live Timeline</title><style>html,body{margin:0;background:#06131d;color:#fff;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#b9ccd8}.loading strong{color:#5eead4}</style></head><body><div class="loading" id="loading"><div><strong>Loading the exact historical interactive timeline…</strong><br><br>This page is opening the saved August 16 working version without redesigning it.</div></div><script>(async()=>{const nativeFetch=window.fetch.bind(window);const rawPrefix='https://raw.githubusercontent.com/Pegasides/Ogallala-Aquifer-Tracker/main/.v33-alpha2/';window.fetch=(input,init)=>{let u=typeof input==='string'?input:(input&&input.url)||'';if(u.startsWith(rawPrefix)){const local=new URL('.v33-alpha2/'+u.slice(rawPrefix.length),location.href).href;return nativeFetch(local,init)}return nativeFetch(input,init)};try{const r=await nativeFetch('historical-v3-map.html',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').innerHTML='<div><strong>Historical page could not be loaded.</strong><br><br>'+String(e)+'</div>';}})();</script></body></html>
