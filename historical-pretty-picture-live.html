<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical Pretty Picture Live Timeline</title><style>html,body{margin:0;background:#06131d;color:#fff;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#b9ccd8}.loading strong{color:#5eead4}</style></head><body><div class="loading" id="loading"><div><strong>Loading Pretty Picture 4…</strong><br><br>Restoring the approved live timeline with refined basin color boundaries and clearer lettering.</div></div><script>(async()=>{try{const r=await fetch('historical-v3-map.html',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();

// Keep the historical image recovery path public and reliable.
html=html.replace('https://raw.githubusercontent.com/Pegasides/Ogallala-Aquifer-Tracker/main/.v33-alpha2/','historical-pp2-assets/');

// Display the 906px historical master at native desktop width instead of enlarging it to 1180px.
html=html.replace('.shell{width:min(1180px,calc(100% - 18px));','.shell{width:min(906px,calc(100% - 18px));');
html=html.replace('.visual img{display:block;width:100%;height:auto}', '.visual img{display:block;width:100%;height:auto;image-rendering:auto;filter:contrast(1.08) brightness(1.015)}');

// Replace the old oversized overlapping tint boxes with basin-shaped, shared-boundary regions.
const oldTint=/\.tint\{position:absolute;pointer-events:none;mix-blend-mode:hue;opacity:\.85;transition:background \.25s,opacity \.25s\}\.northTint\{[^}]+\}\.centralTint\{[^}]+\}\.southTint\{[^}]+\}/;
const newTint='.tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;opacity:.92;transition:background .25s,opacity .25s;filter:drop-shadow(0 0 1px rgba(225,245,255,.24))}.northTint{clip-path:polygon(24% 10%,35% 9%,44% 12%,47% 17%,49% 22%,48% 28%,47% 32%,48% 34%,45% 36%,39% 37%,34% 36%,29% 35%,25% 33%,23% 29%,22% 23%,23% 15%)}.centralTint{clip-path:polygon(29% 35%,34% 36%,39% 37%,45% 36%,48% 34%,49% 39%,48% 44%,46% 49%,43% 52%,39% 53%,34% 52%,30% 51%,27% 48%,26% 43%,26% 38%)}.southTint{clip-path:polygon(30% 51%,34% 52%,39% 53%,43% 52%,45% 56%,45% 61%,44% 66%,42% 71%,43% 76%,45% 80%,42% 82%,38% 81%,35% 78%,32% 76%,30% 73%,29% 69%,28% 64%,27% 58%,27% 53%)}';
html=html.replace(oldTint,newTint);

// 1950 baseline is all blue. Healthy uses the same basin blue as Good/Stable.
html=html.replace("const colors={Healthy:'#22c55e',Good:'#1686cf'", "const colors={Healthy:'#1686cf',Good:'#1686cf'");

// Restore the established 2035 year state: Northern Stable, Central Stressed, Southern Critical.
html=html.replace("2035:{n:'Stressed',c:'Stressed',s:'Severe'}", "2035:{n:'Stable',c:'Stressed',s:'Critical'}");

// Keep the working-index color blue for the healthy 1950 baseline and strong 1980 state.
html=html.replace("document.getElementById('indexValue').style.color=v>=80?'#22c55e':v>=60?'#eab308':v>=45?'#f97316':'#ef4444';", "document.getElementById('indexValue').style.color=v>=80?'#1686cf':v>=60?'#eab308':v>=45?'#f97316':'#ef4444';");

document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').innerHTML='<div><strong>Pretty Picture 4 could not be loaded.</strong><br><br>'+String(e)+'</div>';}})();</script></body></html>
