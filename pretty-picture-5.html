<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty Picture 5 — Ogallala Aquifer Tracker Live Timeline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06131d;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1050px,calc(100% - 18px));margin:auto;padding:10px 0 24px}
.stage{position:relative;width:100%;background:#02080d;border:1px solid #426075;border-radius:12px;overflow:hidden;box-shadow:0 16px 38px rgba(0,0,0,.38);user-select:none;-webkit-user-select:none}
#timelineImage{display:block;width:100%;height:auto;object-fit:contain;background:#02080d;transition:opacity .12s ease;pointer-events:none}
#pixelCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:11;display:none;pointer-events:none;transition:opacity .12s ease}
#textPatches{position:absolute;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}
.patch{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07131d;color:#b9ccd8;z-index:40;font-size:14px;pointer-events:none}.loading strong{color:#5eead4}
.hot{position:absolute;z-index:20;border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:7px}
.hot:focus-visible{outline:3px solid rgba(94,234,212,.9);outline-offset:-2px}
.year-hot,#playHot{top:66.4%;height:5.0%}
#y1950{left:3.2%;width:9.9%}#y1980{left:14.7%;width:10.2%}#y2026{left:26.2%;width:10.0%}#y2030{left:37.5%;width:10.1%}#y2035{left:49.0%;width:10.1%}#y2040{left:60.5%;width:10.4%}#y2045{left:72.2%;width:9.8%}#y2050{left:82.8%;width:6.5%}#playHot{left:89.1%;width:9.0%}
#sliderHot{position:absolute;z-index:19;left:2.6%;top:71.5%;width:94.8%;height:5.5%;cursor:ew-resize;touch-action:none;background:transparent;border-radius:9px}
#sliderHot:focus-visible{outline:3px solid rgba(94,234,212,.9);outline-offset:-2px}
</style>
</head>
<body>
<main class="wrap"><section class="stage">
<div class="loading" id="loading"><div><strong>Loading Pretty Picture 5…</strong></div></div>
<img id="timelineImage" alt="Ogallala Aquifer Tracker interactive timeline" src="approved-timeline-images/2026.png?v=20260817-pixelsafe-1">
<canvas id="pixelCanvas" width="1448" height="1086" aria-hidden="true"></canvas>

<svg id="textPatches" viewBox="0 0 1448 1086" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <g id="patch2035" class="patch">
    <rect x="760" y="312" width="172" height="116" rx="14" fill="#07131d" stroke="#c62828" stroke-width="1.5"/>
    <text x="846" y="344" text-anchor="middle" fill="#ff3434" font-family="Arial" font-size="16" font-weight="700">CENTRAL BASIN</text>
    <text x="846" y="376" text-anchor="middle" fill="#ff3434" font-family="Arial" font-size="24" font-weight="700">Critical</text>
    <text x="846" y="404" text-anchor="middle" fill="#f2f2f2" font-family="Arial" font-size="15">(NE, CO, KS)</text>
    <rect x="718" y="886" width="322" height="48" fill="#06131d"/>

    <rect x="280" y="654" width="214" height="35" fill="#0759a8"/>
    <text x="387" y="678" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">50 — 2035 PROJECTION</text>
  </g>
  <g id="patch2040" class="patch">
    <rect x="759" y="500" width="174" height="116" rx="14" fill="#07131d" stroke="#c62828" stroke-width="1.5"/>
    <text x="846" y="533" text-anchor="middle" fill="#ff3434" font-family="Arial" font-size="16" font-weight="700">SOUTHERN BASIN</text>
    <text x="846" y="566" text-anchor="middle" fill="#ff3434" font-family="Arial" font-size="24" font-weight="700">Critical</text>
    <text x="846" y="594" text-anchor="middle" fill="#f2f2f2" font-family="Arial" font-size="14">(TX Panhandle, OK, NM)</text>
    <rect x="1055" y="886" width="325" height="48" fill="#06131d"/>
    <text x="1082" y="918" fill="#ff3434" font-family="Arial" font-size="27" font-weight="700">Southern — Critical</text>
    <rect x="285" y="654" width="211" height="35" fill="#0759a8"/>
    <text x="390" y="678" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">45 — 2040 PROJECTION</text>
  </g>
</svg>

<button class="hot year-hot" id="y1950" data-index="0" type="button" aria-label="Show 1950"></button><button class="hot year-hot" id="y1980" data-index="1" type="button" aria-label="Show 1980"></button><button class="hot year-hot" id="y2026" data-index="2" type="button" aria-label="Show 2026"></button><button class="hot year-hot" id="y2030" data-index="3" type="button" aria-label="Show 2030"></button><button class="hot year-hot" id="y2035" data-index="4" type="button" aria-label="Show 2035"></button><button class="hot year-hot" id="y2040" data-index="5" type="button" aria-label="Show 2040"></button><button class="hot year-hot" id="y2045" data-index="6" type="button" aria-label="Show 2045"></button><button class="hot year-hot" id="y2050" data-index="7" type="button" aria-label="Show 2050"></button><button class="hot" id="playHot" type="button" aria-label="Play timeline"></button><div id="sliderHot" role="slider" tabindex="0" aria-label="Timeline slider" aria-valuemin="0" aria-valuemax="7" aria-valuenow="2"></div>
</section></main>
<script>
(function(){
const years=[1950,1980,2026,2030,2035,2040,2045,2050],indexes=[100,85,60,55,50,45,42,40];
const sources=years.map(y=>'approved-timeline-images/'+y+'.png?v=20260817-pixelsafe-1');
const image=document.getElementById('timelineImage'),loading=document.getElementById('loading'),canvas=document.getElementById('pixelCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),buttons=[...document.querySelectorAll('.year-hot')],play=document.getElementById('playHot'),slider=document.getElementById('sliderHot'),patch2035=document.getElementById('patch2035'),patch2040=document.getElementById('patch2040');
let current=2,timer=null,dragging=false;
const cache={};
function hidePatches(){patch2035.style.display='none';patch2040.style.display='none'}
function showPatches(i){hidePatches();if(i===4)patch2035.style.display='block';if(i===5)patch2040.style.display='block'}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d!==0){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1}return[h,max===0?0:d/max,max]}
function hsvToRgb(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;default:r=v;g=p;b=q}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function processFuture(i,img){if(cache[i])return cache[i];const off=document.createElement('canvas');off.width=1448;off.height=1086;const oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(img,0,0,1448,1086);const im=oc.getImageData(0,0,1448,1086),d=im.data;for(let y=65;y<=740;y++){for(let x=350;x<=790;x++){const k=(y*1448+x)*4,r=d[k],g=d[k+1],b=d[k+2];const max=Math.max(r,g,b),min=Math.min(r,g,b);if(max<30||max-min<20)continue;const hsv=rgbToHsv(r,g,b),h=hsv[0],s=hsv[1],v=hsv[2];if(s<.22)continue;let out=null;if(i>=5&&y<=335&&h>.48&&h<.72){out=hsvToRgb(30/360,Math.max(s,.72),v)}else if(i>=4&&y>=220&&y<=500&&h>.035&&h<.12){out=hsvToRgb(0,Math.max(s,.78),v)}else if(i>=6&&y>=390&&(h<.035||h>.96)){out=hsvToRgb(355/360,Math.max(s,.75),v*.62)}if(out){d[k]=out[0];d[k+1]=out[1];d[k+2]=out[2]}}}oc.putImageData(im,0,0);cache[i]=off;return off}
function updateAria(){slider.setAttribute('aria-valuenow',String(current));slider.setAttribute('aria-valuetext',years[current]+' — Tracker Working Index '+indexes[current])}
function select(i){current=Math.max(0,Math.min(7,Number(i)));const next=sources[current],pre=new Image();canvas.style.display='none';hidePatches();image.style.opacity='.25';pre.onload=function(){image.src=next;image.alt='Ogallala Aquifer Tracker — '+years[current]+' — Tracker Working Index '+indexes[current];if(current>=4){const rendered=processFuture(current,pre);ctx.clearRect(0,0,1448,1086);ctx.drawImage(rendered,0,0);canvas.style.opacity='.25';canvas.style.display='block';showPatches(current);requestAnimationFrame(()=>canvas.style.opacity='1')}image.style.opacity='1'};pre.onerror=function(){image.style.opacity='1'};pre.src=next;updateAria()}
function stop(){if(timer){clearInterval(timer);timer=null}}function step(){if(current>=7){stop();return}select(current+1)}function togglePlay(){if(timer){stop();return}if(current>=7)select(0);else select(current+1);timer=setInterval(step,1200)}
buttons.forEach(b=>b.addEventListener('click',()=>{stop();select(b.dataset.index)}));play.addEventListener('click',togglePlay);
function indexFromPointer(e){const r=slider.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));return Math.round((x/r.width)*7)}
slider.addEventListener('pointerdown',e=>{stop();dragging=true;try{slider.setPointerCapture(e.pointerId)}catch(_){}select(indexFromPointer(e))});slider.addEventListener('pointermove',e=>{if(dragging)select(indexFromPointer(e))});slider.addEventListener('pointerup',e=>{dragging=false;try{slider.releasePointerCapture(e.pointerId)}catch(_){}});slider.addEventListener('pointercancel',()=>dragging=false);slider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();stop();select(current-1)}if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();stop();select(current+1)}if(e.key==='Home'){e.preventDefault();stop();select(0)}if(e.key==='End'){e.preventDefault();stop();select(7)}});
image.addEventListener('load',()=>{if(loading)loading.remove()},{once:true});image.addEventListener('error',()=>{if(loading)loading.innerHTML='<div><strong>Timeline image could not be loaded.</strong><br><br>Please refresh the page.</div>'},{once:true});sources.forEach(src=>{const p=new Image();p.src=src});updateAria();
})();
</script></body></html>
