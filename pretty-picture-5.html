<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty Picture 5 — Ogallala Aquifer Tracker Live Timeline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06131d;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1050px,calc(100% - 18px));margin:auto;padding:10px 0 24px}
.stage{position:relative;width:100%;background:#02080d;border:1px solid #426075;border-radius:12px;overflow:hidden;box-shadow:0 16px 38px rgba(0,0,0,.38);user-select:none;-webkit-user-select:none}
#timelineImage{display:block;width:100%;height:auto;object-fit:contain;background:#02080d;transition:opacity .12s ease;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07131d;color:#b9ccd8;z-index:30;font-size:14px;pointer-events:none}.loading strong{color:#5eead4}
#controlSurface{position:absolute;left:0;right:0;top:70%;bottom:3%;z-index:20;cursor:pointer;touch-action:none;background:transparent}
#controlSurface:focus-visible{outline:2px solid rgba(94,234,212,.85);outline-offset:-3px}
</style>
</head>
<body>
<main class="wrap">
  <section class="stage" id="stage">
    <div class="loading" id="loading"><div><strong>Loading Pretty Picture 5…</strong></div></div>
    <img id="timelineImage" alt="Ogallala Aquifer Tracker interactive timeline" src="approved-timeline-images/2026.png?v=20260817-live3">
    <div id="controlSurface" role="application" tabindex="0" aria-label="Interactive timeline controls built into the image"></div>
  </section>
</main>
<script>
(function(){
  const years=[1950,1980,2026,2030,2035,2040,2045,2050];
  const indexes=[100,85,60,55,50,45,42,40];
  const sources=years.map(y=>'approved-timeline-images/'+y+'.png?v=20260817-live3');
  const image=document.getElementById('timelineImage');
  const surface=document.getElementById('controlSurface');
  const loading=document.getElementById('loading');
  let current=2;
  let playTimer=null;
  let previewTimer=null;
  let previewStep=0;
  let dragging=false;
  let playing=false;

  function cancelPreview(){
    if(previewTimer){clearTimeout(previewTimer);previewTimer=null;}
    previewStep=99;
  }

  function stopPlay(){
    playing=false;
    if(playTimer){clearInterval(playTimer);playTimer=null;}
  }

  function show(i){
    current=Math.max(0,Math.min(7,Number(i)));
    const next=sources[current];
    const pre=new Image();
    image.style.opacity='.25';
    pre.onload=function(){
      image.src=next;
      image.alt='Ogallala Aquifer Tracker — '+years[current]+' — Tracker Working Index '+indexes[current];
      requestAnimationFrame(function(){image.style.opacity='1';});
    };
    pre.onerror=function(){image.style.opacity='1';};
    pre.src=next;
    surface.setAttribute('aria-label','Interactive timeline. '+years[current]+', Tracker Working Index '+indexes[current]);
  }

  function togglePlay(){
    cancelPreview();
    if(playing){stopPlay();return;}
    playing=true;
    if(current>=7) show(0);
    playTimer=setInterval(function(){
      if(current>=7){stopPlay();return;}
      show(current+1);
    },1400);
  }

  function rel(e){
    const r=surface.getBoundingClientRect();
    return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};
  }

  function yearFromX(x){
    return Math.max(0,Math.min(7,Math.floor((x/0.84)*8)));
  }

  function handlePoint(e,move){
    const p=rel(e);
    // The top half of this broad control surface covers the baked-in year buttons and Play Timeline.
    if(p.y<0.56 && !move){
      cancelPreview();stopPlay();
      if(p.x>=0.84){togglePlay();return;}
      show(yearFromX(p.x));
      return;
    }
    // The lower half covers the baked-in slider. Drag anywhere across it to select a year.
    if(p.y>=0.42){
      cancelPreview();stopPlay();
      show(Math.round(p.x*7));
    }
  }

  surface.addEventListener('pointerdown',function(e){
    dragging=true;
    try{surface.setPointerCapture(e.pointerId);}catch(_){ }
    handlePoint(e,false);
  });
  surface.addEventListener('pointermove',function(e){if(dragging)handlePoint(e,true);});
  surface.addEventListener('pointerup',function(e){dragging=false;try{surface.releasePointerCapture(e.pointerId);}catch(_){ }});
  surface.addEventListener('pointercancel',function(){dragging=false;});

  surface.addEventListener('keydown',function(e){
    cancelPreview();
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();stopPlay();show(current-1);}
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();stopPlay();show(current+1);}
    if(e.key==='Home'){e.preventDefault();stopPlay();show(0);}
    if(e.key==='End'){e.preventDefault();stopPlay();show(7);}
    if(e.key===' '||e.key==='Enter'){e.preventDefault();togglePlay();}
  });

  image.addEventListener('load',function(){if(loading)loading.remove();},{once:true});
  image.addEventListener('error',function(){if(loading)loading.innerHTML='<div><strong>Timeline image could not be loaded.</strong><br><br>Please refresh the page.</div>';},{once:true});
  sources.forEach(function(src){const p=new Image();p.src=src;});

  // One automatic proof-of-life pass on opening. Any user interaction cancels it.
  function preview(){
    if(previewStep===99)return;
    const seq=[0,1,2,3,4,5,6,7,2];
    if(previewStep>=seq.length)return;
    show(seq[previewStep++]);
    previewTimer=setTimeout(preview,850);
  }
  previewTimer=setTimeout(preview,900);
})();
</script>
</body>
</html>
