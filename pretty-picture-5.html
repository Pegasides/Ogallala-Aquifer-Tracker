<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty Picture 5 — Ogallala Aquifer Tracker Preview</title>
<style>
:root{--bg:#06131d;--panel:#0b1e2a;--line:#355064;--ink:#eef7fb;--muted:#a9becb;--aqua:#5eead4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1000px,calc(100% - 18px));margin:auto;padding:9px 0 24px}
.preview{text-align:center;color:var(--aqua);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 8px}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#02080d;border:1px solid #426075;border-radius:12px;overflow:hidden;box-shadow:0 16px 38px rgba(0,0,0,.38)}
#timelineImage{display:block;width:100%;height:100%;object-fit:contain;background:#02080d}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07131d;color:#b9ccd8;z-index:30}
.loading strong{color:var(--aqua)}
.hot{position:absolute;top:78.15%;height:5.7%;border:0;background:transparent;cursor:pointer;z-index:10;border-radius:6px}
.hot:hover,.hot:focus-visible{outline:2px solid rgba(94,234,212,.75);outline-offset:-2px;background:rgba(94,234,212,.05)}
.hot.active{outline:2px solid rgba(94,234,212,.34);outline-offset:-2px}
#y1950{left:1.35%;width:9.8%}
#y1980{left:11.85%;width:10.15%}
#y2026{left:22.6%;width:10.2%}
#y2030{left:33.35%;width:9.55%}
#y2035{left:43.55%;width:10.15%}
#y2040{left:54.15%;width:9.7%}
#y2045{left:64.4%;width:9.8%}
#y2050{left:74.8%;width:9.25%}
#playHot{left:84.65%;width:14.15%}
.controls{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
#yearSlider{width:100%;accent-color:#36aeea;cursor:pointer}
.ticks{display:flex;justify-content:space-between;color:#9fb5c3;font-size:10px}
.status,.help{text-align:center;margin-top:8px;font-size:12px}
.status strong{color:var(--aqua)}
.help{color:var(--muted);font-size:11px}
@media(max-width:700px){.ticks{font-size:8px}.status,.help{font-size:10px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="preview">Version 3.3 Preview · Pretty Picture 5</div>
  <section class="stage">
    <div class="loading" id="loading"><div><strong>Loading Pretty Picture 5…</strong><br><br>Preparing the approved timeline images.</div></div>
    <img id="timelineImage" alt="Pretty Picture 5 interactive Ogallala Aquifer timeline" src="approved-timeline-images/2026.png">
    <button class="hot" id="y1950" data-index="0" aria-label="Show 1950"></button>
    <button class="hot" id="y1980" data-index="1" aria-label="Show 1980"></button>
    <button class="hot" id="y2026" data-index="2" aria-label="Show 2026"></button>
    <button class="hot" id="y2030" data-index="3" aria-label="Show 2030"></button>
    <button class="hot" id="y2035" data-index="4" aria-label="Show 2035"></button>
    <button class="hot" id="y2040" data-index="5" aria-label="Show 2040"></button>
    <button class="hot" id="y2045" data-index="6" aria-label="Show 2045"></button>
    <button class="hot" id="y2050" data-index="7" aria-label="Show 2050"></button>
    <button class="hot" id="playHot" aria-label="Play or pause timeline"></button>
  </section>
  <section class="controls">
    <input id="yearSlider" type="range" min="0" max="7" step="1" value="2" aria-label="Timeline year slider">
    <div class="ticks"><span>1950</span><span>1980</span><span>2026</span><span>2030</span><span>2035</span><span>2040</span><span>2045</span><span>2050</span></div>
    <div class="status" id="status"></div>
    <div class="help">Click a year on the dashboard, drag the slider, or click Play Timeline.</div>
  </section>
</main>
<script>
const years=[1950,1980,2026,2030,2035,2040,2045,2050];
const indexes=[100,85,60,55,50,45,42,40];
const sources=years.map(y=>'approved-timeline-images/'+y+'.png');
const image=document.getElementById('timelineImage');
const slider=document.getElementById('yearSlider');
const status=document.getElementById('status');
const buttons=[...document.querySelectorAll('.hot[data-index]')];
const play=document.getElementById('playHot');
const loading=document.getElementById('loading');
let current=2,timer=null,playing=false;

function ui(){
  slider.value=current;
  buttons.forEach((b,i)=>b.classList.toggle('active',i===current));
  status.innerHTML='Selected year: <strong>'+years[current]+'</strong> · Tracker Working Index: <strong>'+indexes[current]+'</strong>'+(playing?' · <strong>Playing</strong>':'');
}

function show(i){
  current=Math.max(0,Math.min(7,+i));
  image.src=sources[current];
  image.alt='Ogallala Aquifer Tracker — '+years[current]+' — Tracker Working Index '+indexes[current];
  ui();
}

function stop(){
  playing=false;
  if(timer){clearInterval(timer);timer=null;}
  ui();
}

function start(){
  if(playing){stop();return;}
  playing=true;
  if(current>=7) current=0;
  show(current);
  timer=setInterval(()=>{
    if(current>=7){stop();return;}
    show(current+1);
  },1500);
}

buttons.forEach(b=>b.onclick=()=>{stop();show(b.dataset.index);});
slider.oninput=()=>{stop();show(slider.value);};
play.onclick=()=>playing?stop():start();

image.addEventListener('load',()=>{if(loading) loading.remove();},{once:true});
image.addEventListener('error',()=>{
  if(loading) loading.innerHTML='<div><strong>Pretty Picture 5 image could not be loaded.</strong><br><br>Please refresh the page.</div>';
},{once:true});

sources.forEach(src=>{const p=new Image();p.src=src;});
ui();
</script>
</body>
</html>
