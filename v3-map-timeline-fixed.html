<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ogallala Aquifer Tracker — Interactive Timeline</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131d}
#site{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" src="v3-map.html" title="Ogallala Aquifer Tracker Interactive Timeline"></iframe>
<script>
const site=document.getElementById('site');
const YEARS=[1950,1980,2026,2030,2035,2040,2045,2050];
const INDEX={1950:100,1980:85,2026:60,2030:55,2035:50,2040:45,2045:42,2050:40};
const CROP={1950:'0% 0%',1980:'100% 0%',2026:'0% 100%',2030:'100% 100%',2035:'100% 100%',2040:'100% 100%',2045:'100% 100%',2050:'100% 100%'};
const PROJ=new Set([2030,2035,2040,2045]);

function install(){
  try{
    const outer=site.contentDocument;
    const tf=outer&&outer.getElementById('timelineFrame');
    const doc=tf&&tf.contentDocument;
    const win=tf&&tf.contentWindow;
    if(!doc||!win)return false;
    if(doc.documentElement.dataset.v33DirectController==='1')return true;
    doc.documentElement.dataset.v33DirectController='1';

    const style=doc.createElement('style');
    style.textContent=`
      .year-buttons{display:grid!important;grid-template-columns:repeat(4,minmax(90px,1fr))!important;gap:10px!important;max-width:720px!important;margin:0 auto 14px!important;position:relative!important;z-index:1000!important;pointer-events:auto!important}
      .year-btn{display:block!important;width:100%!important;min-width:0!important;padding:11px 8px!important;cursor:pointer!important;pointer-events:auto!important;position:relative!important;z-index:1001!important}
      .slider-row{display:block!important;max-width:720px!important;margin:12px auto 0!important;position:relative!important;z-index:1000!important;pointer-events:auto!important}
      #yearSlider,.play-btn{pointer-events:auto!important;cursor:pointer!important;position:relative!important;z-index:1001!important}
      .tick-row{display:flex!important;justify-content:space-between!important;font-size:10px!important}
      #map-viewport{aspect-ratio:3/2!important;min-height:0!important;height:auto!important;overflow:hidden!important;position:relative!important}
      #v33-anchor-poster{display:none!important}
      #v32-pretty-aquifer,#map-engine-layer,#basin-layer,#community-layer,#hotspot-layer,#data-center-layer,.pretty-state-label{visibility:hidden!important}
      .v33-direct-poster{position:absolute;inset:0;z-index:460;background-image:url('ChatGPT%20Image%20Aug%2015,%202026,%2010_13_39%20AM.png');background-size:200% 200%;background-repeat:no-repeat;background-color:#0d1720;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .45s ease}
      .v33-direct-poster.active{opacity:1}
      #v33-index-badge{position:absolute;right:14px;top:14px;z-index:920;min-width:112px;padding:7px 10px;border-radius:9px;background:rgba(5,18,26,.92);border:1px solid rgba(145,190,211,.62);text-align:center;color:#eef8fb;pointer-events:none}
      #v33-index-badge .label{font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#b9d2de}
      #v33-index-badge .value{font-size:20px;font-weight:900;line-height:1.05;margin-top:2px}
      #v33-embedded-index-fix{position:absolute;left:18.35%;top:57.1%;width:14.75%;height:20.4%;z-index:950;display:none;box-sizing:border-box;border-radius:6px;background:#071722;border:1px solid rgba(82,188,235,.82);color:#eef8fb;pointer-events:none;overflow:hidden;text-align:center;padding:3px 4px 0}
      #v33-embedded-index-fix.show{display:flex;flex-direction:column;align-items:stretch}
      #v33-embedded-index-fix .label{font-size:6.5px;line-height:1.05;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#62c6f4;white-space:nowrap}
      #v33-embedded-index-fix .sub{font-size:5.8px;line-height:1.05;color:#b6cbd5;margin-top:2px}
      #v33-embedded-index-fix .value{font-size:22px;font-weight:900;line-height:1;color:#ff6b47;margin:3px 0 1px}
      #v33-embedded-index-fix .mini-track{height:5px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden;margin:4px 3px 3px}
      #v33-embedded-index-fix .fill{height:100%;border-radius:999px;background:#f97316;transition:width .35s ease}
      #v33-embedded-index-fix .footer{margin-top:auto;background:#0877be;color:#fff;font-size:6.3px;font-weight:900;line-height:1;padding:3px 1px 4px;margin-left:-4px;margin-right:-4px}
      @media(max-width:620px){.year-buttons{grid-template-columns:repeat(2,minmax(100px,1fr))!important}.tick-row{font-size:8px!important}}
    `;
    doc.head.appendChild(style);

    const viewport=doc.getElementById('map-viewport');
    if(!viewport)return false;
    ['v33-projection-poster','v33-projection-index','v33-index-panel','v33-smooth-poster-a','v33-smooth-poster-b','v33-index-badge','v33-embedded-index-fix'].forEach(id=>{const e=doc.getElementById(id);if(e)e.remove();});

    const a=doc.createElement('div');a.className='v33-direct-poster active';
    const b=doc.createElement('div');b.className='v33-direct-poster';
    viewport.append(a,b);
    let active=a,standby=b,current=2026;

    const badge=doc.createElement('div');badge.id='v33-index-badge';badge.innerHTML='<div class="label">Tracker Working Index</div><div class="value" id="v33-badge-value">60</div>';viewport.appendChild(badge);
    const fix=doc.createElement('div');fix.id='v33-embedded-index-fix';fix.innerHTML='<div class="label">Tracker Working Index</div><div class="sub">Relative aquifer condition</div><div class="value" id="v33-fix-value"></div><div class="mini-track"><div class="fill" id="v33-fix-fill"></div></div><div class="footer" id="v33-fix-footer"></div>';viewport.appendChild(fix);

    const wrap=doc.querySelector('.year-buttons');
    if(wrap){
      const btn2050=[...wrap.querySelectorAll('.year-btn')].find(x=>Number(x.dataset.year)===2050);
      [2030,2035,2040,2045].forEach(y=>{if(!wrap.querySelector(`[data-year="${y}"]`)){const x=doc.createElement('button');x.type='button';x.className='year-btn';x.dataset.year=String(y);x.textContent=String(y);wrap.insertBefore(x,btn2050||null);}});
      wrap.querySelectorAll('.year-btn').forEach(x=>{x.type='button';x.disabled=false;});
    }

    const slider=doc.getElementById('yearSlider');
    if(slider){slider.min='0';slider.max='7';slider.step='1';slider.disabled=false;}
    const ticks=doc.querySelector('.tick-row');if(ticks)ticks.innerHTML=YEARS.map(y=>`<span>${y}</span>`).join('');

    function paint(year,animate=true){
      if(!YEARS.includes(year))return;
      current=year;
      const pos=CROP[year];
      if(animate){standby.style.backgroundPosition=pos;standby.classList.add('active');active.classList.remove('active');[active,standby]=[standby,active];}
      else{active.style.backgroundPosition=pos;active.classList.add('active');standby.classList.remove('active');}
      const val=INDEX[year];
      const bv=doc.getElementById('v33-badge-value');if(bv)bv.textContent=val;
      const fv=doc.getElementById('v33-fix-value');const ff=doc.getElementById('v33-fix-fill');const ft=doc.getElementById('v33-fix-footer');
      fix.classList.toggle('show',PROJ.has(year));
      if(PROJ.has(year)){if(fv)fv.textContent=val;if(ff)ff.style.width=val+'%';if(ft)ft.textContent=val+' — '+year+' PROJECTION';}
      doc.querySelectorAll('.year-btn').forEach(x=>x.classList.toggle('active',Number(x.dataset.year)===year));
      if(slider)slider.value=String(YEARS.indexOf(year));
      const sy=doc.getElementById('sliderYear');if(sy)sy.textContent=String(year);
    }

    function setYear(year){
      paint(year,true);
      try{if(typeof win.setTimelineYear==='function')win.setTimelineYear(year);else if(typeof win.updateYear==='function')win.updateYear(year);}catch(e){}
      paint(year,false);
    }

    let playing=false,timer=null;
    function stop(){playing=false;if(timer){clearTimeout(timer);timer=null;}const p=doc.getElementById('playTimeline');if(p)p.textContent='▶ Play Timeline';}
    function advance(){if(!playing)return;let i=YEARS.indexOf(current);i=(i+1)%YEARS.length;setYear(YEARS[i]);timer=setTimeout(advance,1800);}

    doc.addEventListener('click',ev=>{
      const btn=ev.target.closest('.year-btn');
      if(btn){ev.preventDefault();ev.stopImmediatePropagation();setYear(Number(btn.dataset.year));return;}
      const play=ev.target.closest('#playTimeline');
      if(play){ev.preventDefault();ev.stopImmediatePropagation();if(playing){stop();}else{playing=true;play.textContent='■ Stop Timeline';timer=setTimeout(advance,350);}return;}
    },true);

    if(slider){
      slider.addEventListener('input',ev=>{ev.stopImmediatePropagation();setYear(YEARS[Number(slider.value)]);},true);
      slider.addEventListener('change',ev=>{ev.stopImmediatePropagation();setYear(YEARS[Number(slider.value)]);},true);
    }

    const initial=Number((doc.getElementById('sliderYear')?.textContent||'2026').trim());
    paint(YEARS.includes(initial)?initial:2026,false);
    return true;
  }catch(e){console.error(e);return false;}
}

site.addEventListener('load',()=>{
  let tries=0;
  const poll=setInterval(()=>{tries++;if(install()||tries>100)clearInterval(poll);},120);
});
</script>
</body>
</html>
