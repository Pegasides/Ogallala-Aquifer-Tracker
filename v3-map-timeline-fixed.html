<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ogallala Aquifer Tracker — Interactive Timeline</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131d}
#site{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" src="v3-map.html" title="Ogallala Aquifer Tracker Interactive Timeline"></iframe>
<script>
const site=document.getElementById('site');
function applyTimelineFix(){
  try{
    const outer=site.contentDocument;
    const timeline=outer&&outer.getElementById('timelineFrame');
    const doc=timeline&&timeline.contentDocument;
    const win=timeline&&timeline.contentWindow;
    if(!doc||!win)return false;

    let style=doc.getElementById('v33-four-year-timeline-fix');
    if(!style){
      style=doc.createElement('style');
      style.id='v33-four-year-timeline-fix';
      style.textContent=`
        .year-buttons{display:grid!important;grid-template-columns:repeat(4,minmax(90px,1fr))!important;gap:10px!important;max-width:720px!important;margin:0 auto!important}
        .year-btn{width:100%!important;min-width:0!important;font-size:14px!important;padding:11px 8px!important}
        .slider-row{display:block!important;max-width:720px!important;margin:18px auto 0!important}
        #yearSlider{width:100%!important}
        .tick-row{display:flex!important;justify-content:space-between!important;gap:4px!important;font-size:10px!important}
        .play-btn{display:block!important}

        #v33-anchor-poster{background-size:200% 200%!important;background-repeat:no-repeat!important}
        body.v33-anchor-year #map-viewport,
        body.v33-projection-year #map-viewport{aspect-ratio:3/2!important;min-height:0!important;height:auto!important}
        body.v33-year-1950 #v33-anchor-poster{background-position:0% 0%!important}
        body.v33-year-1980 #v33-anchor-poster{background-position:100% 0%!important}
        body.v33-year-2026 #v33-anchor-poster{background-position:0% 100%!important}
        body.v33-year-2050 #v33-anchor-poster{background-position:100% 100%!important}

        #v33-projection-poster{
          position:absolute;inset:0;z-index:459;display:none;
          background-image:url('ChatGPT%20Image%20Aug%2015,%202026,%2010_13_39%20AM.png');
          background-repeat:no-repeat;background-color:#0d1720;
          background-size:200% 200%;background-position:100% 100%;
          pointer-events:none;overflow:hidden;border-radius:10px;
        }
        body.v33-projection-year #v33-projection-poster{display:block}
        body.v33-projection-year #v32-pretty-aquifer,
        body.v33-projection-year #map-engine-layer,
        body.v33-projection-year #basin-layer,
        body.v33-projection-year #community-layer,
        body.v33-projection-year #hotspot-layer,
        body.v33-projection-year #data-center-layer,
        body.v33-projection-year .pretty-state-label{visibility:hidden!important}

        @media(max-width:620px){
          .year-buttons{grid-template-columns:repeat(2,minmax(100px,1fr))!important}
          .tick-row{font-size:8px!important}
        }
      `;
      doc.head.appendChild(style);
    }

    const years=[1950,1980,2026,2030,2035,2040,2045,2050];
    const anchors=[1950,1980,2026,2050];
    const projections=[2030,2035,2040,2045];

    const viewport=doc.getElementById('map-viewport');
    if(viewport&&!doc.getElementById('v33-projection-poster')){
      const p=doc.createElement('div');
      p.id='v33-projection-poster';
      p.setAttribute('aria-hidden','true');
      viewport.appendChild(p);
    }

    const buttonWrap=doc.querySelector('.year-buttons');
    if(buttonWrap){
      const btn2050=[...buttonWrap.querySelectorAll('.year-btn')].find(b=>Number(b.dataset.year)===2050);
      [2030,2035,2040,2045].forEach(year=>{
        if(!buttonWrap.querySelector('.year-btn[data-year="'+year+'"]')){
          const btn=doc.createElement('button');
          btn.className='year-btn';
          btn.dataset.year=String(year);
          btn.textContent=String(year);
          buttonWrap.insertBefore(btn,btn2050||null);
        }
      });
    }

    let slider=doc.getElementById('yearSlider');
    if(slider && !slider.dataset.eightStop){
      const clean=slider.cloneNode(true);
      clean.dataset.eightStop='1';
      clean.min='0';clean.max='7';clean.step='1';
      slider.replaceWith(clean);
      slider=clean;
    }

    const tickRow=doc.querySelector('.tick-row');
    if(tickRow)tickRow.innerHTML=years.map(y=>'<span>'+y+'</span>').join('');

    function syncPoster(year){
      const isAnchor=anchors.includes(year);
      const isProjection=projections.includes(year);
      doc.body.classList.toggle('v33-anchor-year',isAnchor);
      doc.body.classList.toggle('v33-projection-year',isProjection);
      anchors.forEach(y=>doc.body.classList.toggle('v33-year-'+y,isAnchor&&year===y));
    }

    function setYear(year){
      if(typeof win.setTimelineYear==='function')win.setTimelineYear(year);
      else if(typeof win.updateYear==='function')win.updateYear(year);
      const idx=years.indexOf(year);
      if(slider&&idx>=0)slider.value=String(idx);
      syncPoster(year);
      doc.querySelectorAll('.year-btn').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.year)===year));
    }

    doc.querySelectorAll('.year-btn').forEach(btn=>{
      if(!btn.dataset.eightStopBound){
        btn.dataset.eightStopBound='1';
        btn.addEventListener('click',()=>setYear(Number(btn.dataset.year)));
      }
    });

    if(slider&&!slider.dataset.eightStopBound){
      slider.dataset.eightStopBound='1';
      slider.addEventListener('input',()=>setYear(years[Number(slider.value)]));
      slider.addEventListener('change',()=>setYear(years[Number(slider.value)]));
    }

    let play=doc.getElementById('playTimeline');
    if(play&&!play.dataset.strictEightStep){
      const cleanPlay=play.cloneNode(true);
      cleanPlay.dataset.strictEightStep='1';
      play.replaceWith(cleanPlay);
      play=cleanPlay;

      let running=false;
      let timeoutId=null;

      const stopPlayback=()=>{
        running=false;
        if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
        play.textContent='▶ Play Timeline';
      };

      const advance=(index)=>{
        if(!running)return;
        const i=index%years.length;
        setYear(years[i]);
        timeoutId=setTimeout(()=>advance((i+1)%years.length),1800);
      };

      play.addEventListener('click',()=>{
        if(running){stopPlayback();return;}
        running=true;
        play.textContent='■ Stop Timeline';
        const start=Math.max(0,Math.min(7,Number(slider?.value||0)));
        advance(start);
      });
    }

    const shownYear=Number((doc.getElementById('sliderYear')?.textContent||'2026').trim());
    const current=years.includes(shownYear)?shownYear:2026;
    if(slider)slider.value=String(years.indexOf(current));
    syncPoster(current);

    return true;
  }catch(e){return false}
}
site.addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(applyTimelineFix()||tries>60)clearInterval(timer);
  },150);
});
</script>
</body>
</html>
