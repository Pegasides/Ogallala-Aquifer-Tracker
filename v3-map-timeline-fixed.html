<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ogallala Aquifer Tracker — Interactive Timeline</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131d}
#site{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" src="v3-map.html" title="Ogallala Aquifer Tracker Interactive Timeline"></iframe>
<script>
const site=document.getElementById('site');

function installTimelineController(){
  try{
    const outer=site.contentDocument;
    const timeline=outer&&outer.getElementById('timelineFrame');
    const doc=timeline&&timeline.contentDocument;
    const win=timeline&&timeline.contentWindow;
    if(!doc||!win)return false;

    if(doc.documentElement.dataset.v33SeamlessController==='1')return true;
    doc.documentElement.dataset.v33SeamlessController='1';

    const years=[1950,1980,2026,2030,2035,2040,2045,2050];
    const projectionIndex={2030:55,2035:50,2040:45,2045:42};

    const style=doc.createElement('style');
    style.id='v33-seamless-eight-style';
    style.textContent=`
      .year-buttons{display:grid!important;grid-template-columns:repeat(4,minmax(90px,1fr))!important;gap:10px!important;max-width:720px!important;margin:0 auto!important}
      .year-btn{width:100%!important;min-width:0!important;font-size:14px!important;padding:11px 8px!important}
      .slider-row{display:block!important;max-width:720px!important;margin:18px auto 0!important}
      #yearSlider{width:100%!important}
      .tick-row{display:flex!important;justify-content:space-between!important;gap:4px!important;font-size:10px!important}
      .play-btn{display:block!important}

      #v33-anchor-poster{
        background-size:200% 200%!important;
        background-repeat:no-repeat!important;
        transition:background-position .18s ease!important;
      }
      body.v33-anchor-year #v33-anchor-poster{display:block!important}
      body.v33-anchor-year #map-viewport{aspect-ratio:3/2!important;min-height:0!important;height:auto!important}
      body.v33-year-1950 #v33-anchor-poster{background-position:0% 0%!important}
      body.v33-year-1980 #v33-anchor-poster{background-position:100% 0%!important}
      body.v33-year-2026 #v33-anchor-poster{background-position:0% 100%!important}
      body.v33-year-projection #v33-anchor-poster,
      body.v33-year-2050 #v33-anchor-poster{background-position:100% 100%!important}

      #v33-projection-index{
        position:absolute;left:4%;right:4%;bottom:3%;z-index:470;display:none;
        padding:9px 14px 10px;border-radius:10px;
        background:rgba(5,18,26,.96);border:1px solid rgba(145,190,211,.55);
        box-shadow:0 8px 24px rgba(0,0,0,.42);text-align:center;color:#eef8fb;
        pointer-events:none;
      }
      body.v33-year-projection #v33-projection-index{display:block!important}
      #v33-projection-index .label{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#b9d2de}
      #v33-projection-index .value{font-size:23px;font-weight:900;line-height:1.15;margin-top:2px}
      #v33-projection-index .note{font-size:9px;color:#9fb5c0;margin-top:2px}

      @media(max-width:620px){
        .year-buttons{grid-template-columns:repeat(2,minmax(100px,1fr))!important}
        .tick-row{font-size:8px!important}
        #v33-projection-index .value{font-size:19px}
      }
    `;
    doc.head.appendChild(style);

    const viewport=doc.getElementById('map-viewport');
    if(viewport&&!doc.getElementById('v33-projection-index')){
      const panel=doc.createElement('div');
      panel.id='v33-projection-index';
      panel.innerHTML='<div class="label">Tracker Working Index · relative aquifer condition</div><div class="value" id="v33-projection-index-value"></div><div class="note">Tracker working index — not percent of water remaining</div>';
      viewport.appendChild(panel);
    }
    const obsolete=doc.getElementById('v33-projection-poster');
    if(obsolete)obsolete.remove();

    const buttonWrap=doc.querySelector('.year-buttons');
    if(buttonWrap){
      const btn2050=[...buttonWrap.querySelectorAll('.year-btn')].find(b=>Number(b.dataset.year)===2050);
      [2030,2035,2040,2045].forEach(year=>{
        if(!buttonWrap.querySelector('.year-btn[data-year="'+year+'"]')){
          const b=doc.createElement('button');
          b.className='year-btn';b.dataset.year=String(year);b.textContent=String(year);
          buttonWrap.insertBefore(b,btn2050||null);
        }
      });
    }

    let slider=doc.getElementById('yearSlider');
    if(slider){
      const clean=slider.cloneNode(true);
      clean.min='0';clean.max='7';clean.step='1';
      slider.replaceWith(clean);slider=clean;
    }
    const tickRow=doc.querySelector('.tick-row');
    if(tickRow)tickRow.innerHTML=years.map(y=>'<span>'+y+'</span>').join('');

    function enforceVisual(year){
      const isProjection=[2030,2035,2040,2045].includes(year);
      doc.body.classList.add('v33-anchor-year');
      doc.body.classList.toggle('v33-year-1950',year===1950);
      doc.body.classList.toggle('v33-year-1980',year===1980);
      doc.body.classList.toggle('v33-year-2026',year===2026);
      doc.body.classList.toggle('v33-year-projection',isProjection);
      doc.body.classList.toggle('v33-year-2050',year===2050);
      const value=doc.getElementById('v33-projection-index-value');
      if(value&&isProjection)value.textContent=projectionIndex[year]+' — Projection';
      doc.querySelectorAll('.year-btn').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.year)===year));
      const idx=years.indexOf(year);
      if(slider&&idx>=0)slider.value=String(idx);
    }

    function currentDisplayedYear(){
      const y=Number((doc.getElementById('sliderYear')?.textContent||'2026').trim());
      return years.includes(y)?y:2026;
    }

    function setYear(year){
      if(typeof win.setTimelineYear==='function')win.setTimelineYear(year);
      else if(typeof win.updateYear==='function')win.updateYear(year);
      enforceVisual(year);
      queueMicrotask(()=>enforceVisual(year));
      requestAnimationFrame(()=>enforceVisual(year));
    }

    doc.querySelectorAll('.year-btn').forEach(btn=>{
      btn.addEventListener('click',()=>setYear(Number(btn.dataset.year)));
    });
    if(slider){
      slider.addEventListener('input',()=>setYear(years[Number(slider.value)]));
      slider.addEventListener('change',()=>setYear(years[Number(slider.value)]));
    }

    const yearLabel=doc.getElementById('sliderYear');
    if(yearLabel){
      const visualGuard=new MutationObserver(()=>{
        const y=currentDisplayedYear();
        queueMicrotask(()=>enforceVisual(y));
      });
      visualGuard.observe(yearLabel,{childList:true,characterData:true,subtree:true});
    }

    let play=doc.getElementById('playTimeline');
    if(play){
      const cleanPlay=play.cloneNode(true);
      play.replaceWith(cleanPlay);play=cleanPlay;
      let running=false;
      let timeoutId=null;
      const stop=()=>{
        running=false;
        if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
        play.textContent='▶ Play Timeline';
      };
      const advance=(index)=>{
        if(!running)return;
        const i=index%years.length;
        setYear(years[i]);
        timeoutId=setTimeout(()=>advance((i+1)%years.length),1800);
      };
      play.addEventListener('click',()=>{
        if(running){stop();return;}
        running=true;
        play.textContent='■ Stop Timeline';
        const start=Math.max(0,Math.min(7,years.indexOf(currentDisplayedYear())));
        advance(start);
      });
    }

    enforceVisual(currentDisplayedYear());
    return true;
  }catch(e){console.error(e);return false;}
}

site.addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(installTimelineController()||tries>80)clearInterval(timer);
  },150);
});
</script>
</body>
</html>
