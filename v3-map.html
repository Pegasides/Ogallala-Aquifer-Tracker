<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Version 3 Interactive Timeline — Ogallala Aquifer Tracker</title>
<style>
:root{--night:#06131d;--panel:#0d2536;--ink:#f7fbff;--muted:#b9ccd8;--aqua:#5eead4;--line:rgba(188,218,235,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.v3bar{height:58px;background:#071a27;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:5}
.v3inner{width:min(1180px,calc(100% - 24px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;font-size:13px;color:#dffcf7;text-decoration:none;white-space:nowrap}
.links{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.links a{color:#e8f2f6;text-decoration:none;border:1px solid #3b596c;background:#102b3d;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.links a:hover,.links a.active{border-color:var(--aqua);background:#123c43;color:#e7fffb}
.context{height:34px;background:#0a202f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--muted);font-size:11px;text-align:center}
.context strong{color:var(--aqua)}
.frame-wrap{height:calc(100vh - 92px);min-height:560px;background:#243442}
iframe{display:block;width:100%;height:100%;border:0;background:#243442}
@media(max-width:760px){
 .v3bar{height:auto;min-height:58px;padding:8px 0}
 .v3inner{display:block}
 .brand{display:block;margin-bottom:7px;font-size:11px}
 .links{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
 .links::-webkit-scrollbar{display:none}
 .links a{flex:0 0 auto}
 .context{height:auto;min-height:36px;padding:7px 12px}
 .frame-wrap{height:calc(100vh - 116px);min-height:520px}
}
</style>
</head>
<body>
<nav class="v3bar" aria-label="Version 3 primary navigation">
  <div class="v3inner">
    <a class="brand" href="v3.html">OGALLALA AQUIFER TRACKER · VERSION 3</a>
    <div class="links">
      <a href="v3.html">V3 Home</a>
      <a class="active" href="v3-map.html">Interactive Timeline</a>
      <a href="index.html">My Aquifer</a>
      <a href="groundwater-window.html">Groundwater Window</a>
    </div>
  </div>
</nav>
<div class="context"><strong>Version 3 timeline:</strong>&nbsp; use the year buttons or slider below. The older map-page header/navigation is hidden here so the experience stays inside Version 3.</div>
<div class="frame-wrap">
  <iframe id="timelineFrame" src="v3-timeline.html" title="Ogallala Aquifer Version 3 interactive timeline"></iframe>
</div>
<script>
const frame=document.getElementById('timelineFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    const header=doc.querySelector('header');
    const nav=doc.querySelector('nav');
    if(header)header.style.display='none';
    if(nav)nav.style.display='none';
    doc.documentElement.style.scrollBehavior='smooth';
  }catch(e){
    console.warn('Version 3 shell could not adjust embedded map chrome.',e);
  }
});
</script>
</body>
</html>
