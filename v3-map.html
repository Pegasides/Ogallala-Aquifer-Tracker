<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Version 3 Interactive Timeline — Ogallala Aquifer Tracker</title>
<style>
:root{--night:#06131d;--panel:#0d2536;--ink:#f7fbff;--muted:#b9ccd8;--aqua:#5eead4;--line:rgba(188,218,235,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.v3bar{height:58px;background:#071a27;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:5}
.v3inner{width:min(1180px,calc(100% - 24px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;font-size:13px;color:#dffcf7;text-decoration:none;white-space:nowrap}
.links{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.links a{color:#e8f2f6;text-decoration:none;border:1px solid #3b596c;background:#102b3d;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.links a:hover,.links a.active{border-color:var(--aqua);background:#123c43;color:#e7fffb}
.context{min-height:34px;background:#0a202f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:7px 12px;color:var(--muted);font-size:11px;text-align:center}
.context strong{color:var(--aqua)}
.frame-wrap{height:calc(100vh - 92px);min-height:560px;background:#243442}
iframe{display:block;width:100%;height:100%;border:0;background:#243442}
@media(max-width:760px){
 .v3bar{height:auto;min-height:58px;padding:8px 0}
 .v3inner{display:block}
 .brand{display:block;margin-bottom:7px;font-size:11px}
 .links{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
 .links::-webkit-scrollbar{display:none}
 .links a{flex:0 0 auto;min-height:40px;display:inline-flex;align-items:center}
 .context{font-size:10px;line-height:1.35}
 .frame-wrap{height:calc(100dvh - 116px);min-height:520px}
}
</style>
</head>
<body>
<nav class="v3bar" aria-label="Version 3 primary navigation">
  <div class="v3inner">
    <a class="brand" href="v3.html">OGALLALA AQUIFER TRACKER · VERSION 3</a>
    <div class="links">
      <a href="v3.html">V3 Home</a>
      <a class="active" href="v3-map.html">Interactive Timeline</a>
      <a href="groundwater-window.html">Groundwater Window</a>
      <a href="index.html">My Aquifer</a>
    </div>
  </div>
</nav>
<div class="context"><strong>Version 3 timeline:</strong>&nbsp; four anchor years tell the main story; 2030–2045 are intermediate projection steps.</div>
<div class="frame-wrap">
  <iframe id="timelineFrame" src="v3-timeline.html" title="Ogallala Aquifer Version 3 interactive timeline"></iframe>
</div>
<script>
const frame=document.getElementById('timelineFrame');
frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    if(!doc)return;
    const header=doc.querySelector('header');
    const nav=doc.querySelector('nav');
    if(header)header.style.display='none';
    if(nav)nav.style.display='none';
    doc.documentElement.style.scrollBehavior='smooth';

    if(!doc.getElementById('v3-shell-refinements')){
      const style=doc.createElement('style');
      style.id='v3-shell-refinements';
      style.textContent=`
        body.v3-year-1950 .community-marker{
          opacity:.55;width:8px;height:8px;background:#dbeafe!important;
          border-color:#64748b;box-shadow:0 0 0 1px rgba(255,255,255,.14);
        }
        body.v3-year-1950 .community-marker:hover{opacity:1;width:14px;height:14px}
        body.v3-year-1980 .community-marker,
        body.v3-projection .community-marker{
          opacity:.7;width:9px;height:9px;background:#dbeafe!important;
          border-color:#64748b;box-shadow:0 0 0 1px rgba(255,255,255,.16);
        }
        body.v3-year-1980 .community-marker:hover,
        body.v3-projection .community-marker:hover{opacity:1;width:15px;height:15px}
        body.v3-year-2026 .side-stack>.summary-card:first-child{
          border-color:#5eead4;box-shadow:0 16px 38px rgba(0,0,0,.32),0 0 0 1px rgba(94,234,212,.12);
        }
        body.v3-year-2026 .side-stack>.summary-card:first-child h3{color:#dffff9}
        body.v3-year-2026 #hotspotNote{background:#352513;border-color:#d9982f;color:#fff3d0}
        body.v3-year-2026 #facilityPanel .facility{background:#12232d;border-color:#3d5260}
        body.v3-year-2026 .summary-row strong{max-width:58%;text-align:right}
        .tick-row span:nth-child(1),.tick-row span:nth-child(2),.tick-row span:nth-child(3),.tick-row span:nth-child(8){color:#e7f5fb;font-weight:900}
        .tick-row span:nth-child(4),.tick-row span:nth-child(5),.tick-row span:nth-child(6),.tick-row span:nth-child(7){opacity:.55;font-size:9px}
        #v3-index-caption{margin-top:4px;color:#9fb6c4;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
        #v3-timeline-hint{margin:6px 0 0;color:#9fb6c4;font-size:10px;text-align:center}
        @media(max-width:620px){
          .shell{padding:12px 10px 40px!important}
          .timeline-card,.map-card,.summary-card,.source-card{border-radius:10px!important}
          .timeline-card{padding:12px!important}
          .year-buttons{gap:7px!important}
          .year-btn{min-width:calc(50% - 4px)!important;padding:10px 8px!important;min-height:44px}
          .slider-row{margin-top:13px!important}
          .status-box{padding:10px!important}
          .status-box strong{font-size:.96rem!important}
          .map-card{padding:10px!important}
          .map-heading h3{font-size:1.08rem!important}
          .map-heading p{font-size:11px!important;line-height:1.4!important}
          #map-viewport{min-height:0!important;height:auto;aspect-ratio:auto!important;overflow:hidden!important}
          .map-grid{left:50%!important;transform-origin:top center!important}
          .basin-callout,.basin-zone::after{display:none!important}
          .community-marker{width:13px;height:13px}
          .hotspot{width:46px;height:46px}
          .dc-pin{width:18px;height:18px}
          .map-tooltip{max-width:calc(100vw - 44px)!important;font-size:11px!important}
          .legend{font-size:10px!important;gap:8px!important}
          .summary-card,.source-card{padding:13px!important}
          .summary-row{align-items:flex-start!important;gap:8px!important}
          .summary-row strong{max-width:58%!important;text-align:right!important}
          .source-card p{font-size:11px!important}
          #v3-index-caption{font-size:9px!important;line-height:1.35!important}
          #v3-timeline-hint{font-size:9px!important;line-height:1.35!important}
        }
      `;
      doc.head.appendChild(style);
    }

    const setText=(id,text)=>{const el=doc.getElementById(id);if(el)el.textContent=text};

    const summaryHealthForCaption=doc.getElementById('summaryHealth');
    if(summaryHealthForCaption && !doc.getElementById('v3-index-caption')){
      const caption=doc.createElement('div');
      caption.id='v3-index-caption';
      caption.textContent='Tracker working index · comparison scale, not percent water remaining';
      summaryHealthForCaption.insertAdjacentElement('afterend',caption);
    }
    const tickRow=doc.querySelector('.tick-row');
    if(tickRow && !doc.getElementById('v3-timeline-hint')){
      const hint=doc.createElement('p');
      hint.id='v3-timeline-hint';
      hint.textContent='Bold dates are anchor years. 2030–2045 are intermediate projection steps.';
      tickRow.insertAdjacentElement('afterend',hint);
    }

    const normalizeCommunityLayer=()=>{
      const layer=doc.getElementById('community-layer');
      if(!layer)return;
      const hereford=[...layer.querySelectorAll('.community-marker')].find(marker=>(marker.title||'').startsWith('Hereford, TX'));
      if(!hereford)return;
      const portales={name:'Portales',state:'NM',basin:'Southern',lat:34.1753553,lon:-103.3565191,x:105,y:433};
      const pos=typeof win.getPoint==='function'?win.getPoint(portales):portales;
      const marker=hereford.cloneNode(false);
      marker.style.left=pos.x+'px';
      marker.style.top=pos.y+'px';
      marker.title='Portales, NM — Southern Basin reference community';
      marker.addEventListener('click',()=>{
        if(typeof win.showTooltip==='function')win.showTooltip(marker,"<strong>Portales, NM</strong><br><span style='color:#475569'>Southern Basin reference community.</span>");
      });
      hereford.replaceWith(marker);
    };

    const normalizeWorkingIndexDisplay=()=>{
      const summaryHealth=doc.getElementById('summaryHealth');
      const value=(summaryHealth?.textContent||'').replace(/[^0-9.]/g,'');
      if(!value)return;
      summaryHealth.textContent=value;
      setText('overallStatus','Tracker working index: '+value);
      const healthBarLabel=doc.getElementById('healthBarLabel');
      if(healthBarLabel)healthBarLabel.textContent=healthBarLabel.textContent.replace('%','');
    };

    const fitTimelineForMobile=()=>{
      const viewport=doc.getElementById('map-viewport');
      const grid=doc.querySelector('.map-grid');
      if(!viewport||!grid)return;
      if(win.innerWidth<=620){
        const available=Math.max(280,viewport.clientWidth-4);
        const scale=Math.min(1,available/500);
        grid.style.left='50%';
        grid.style.transform=`translateX(-50%) scale(${scale})`;
        grid.style.transformOrigin='top center';
        viewport.style.height=Math.ceil(510*scale)+'px';
        viewport.style.minHeight='0';
      }else{
        grid.style.left='';grid.style.transform='';grid.style.transformOrigin='';
        viewport.style.height='';viewport.style.minHeight='';
      }
    };

    const applyYearPresentation=()=>{
      const year=Number((doc.getElementById('sliderYear')?.textContent||'').trim());
      const is1950=year===1950,is1980=year===1980,is2026=year===2026,is2050=year===2050;
      const isProjection=year>2026;
      const isAnchor=is1950||is1980||is2026||is2050;
      doc.body.classList.toggle('v3-year-1950',is1950);
      doc.body.classList.toggle('v3-year-1980',is1980);
      doc.body.classList.toggle('v3-year-2026',is2026);
      doc.body.classList.toggle('v3-projection',isProjection);
      normalizeWorkingIndexDisplay();
      setText('sliderMode',isAnchor?(is2050?'Anchor projection':'Anchor year'):'Projection step');

      const summaryCards=[...doc.querySelectorAll('.side-stack>.summary-card')];
      const summaryHeading=summaryCards[0]?.querySelector('h3');
      const facilityHeading=doc.getElementById('facilityPanel')?.parentElement?.querySelector('h3');
      const sourceNote=doc.querySelector('.source-note');
      if(summaryHeading)summaryHeading.textContent='Selected-year dashboard';
      if(facilityHeading)facilityHeading.textContent='2026 digital-infrastructure context';
      if(sourceNote)sourceNote.textContent='Tracker working indices communicate change over time; they are not USGS percentages of remaining aquifer water. The four anchor indices are 100, 85, 60, and 40, with intermediate projection steps between 2026 and 2050.';

      if(is1950){
        setText('healthDescriptor','Predevelopment baseline working index — not percent of water remaining');
        setText('yearContext','1950 is the Tracker baseline: 100 is a comparison index, not a claim that 100% of the aquifer remains today. All three basin zones are shown Healthy. Community dots are modern reference locations retained only to orient the viewer.');
        setText('communitySummary','28 modern reference locations — orientation only');
        setText('mapSubtitle','1950 baseline: all three basin zones Healthy; modern community locations are muted and retained only for geographic orientation.');
      }else if(is1980){
        setText('healthDescriptor','Early-decline working index — not percent of water remaining');
        setText('yearContext','1980 marks the early-decline comparison point: the Tracker working index is 85, with the Northern Basin shown Good and the Central and Southern basins shown Declining. Community dots are modern reference locations, not an historical monitoring network.');
        setText('communitySummary','28 modern reference locations — orientation only');
        setText('mapSubtitle','1980 early decline: Northern Good; Central and Southern Declining. Modern community locations are muted so basin-scale change remains the focus.');
      }else if(is2026){
        if(summaryHeading)summaryHeading.textContent='2026 — What matters now';
        if(facilityHeading)facilityHeading.textContent='Infrastructure context — not attribution';
        setText('healthDescriptor','Present-day working index — not percent of water remaining');
        setText('yearContext','Present-day view: Northern Stable, Central Stressed, Southern Critical. Community dots show Tracker locations; red rings show regional >150-ft decline context and are not city-specific measurements.');
        setText('communitySummary','28 current tracker communities');
        setText('hotspotSummary','Regional context — parts of TX / OK / KS');
        setText('dcSummary','3 verified examples — context only');
        setText('mapSubtitle','Present-day basin conditions first, followed by community reference points, regional >150-ft decline context, and three verified infrastructure examples.');
      }else if(is2050){
        setText('healthDescriptor','2050 Tracker scenario index — not percent of water remaining');
        setText('yearContext','2050 is a Tracker scenario, not a measured future condition: the working index is 40, with the Northern Basin shown Stressed, Central Critical, and Southern Severe. Present-day hotspot and data-center layers stay hidden, and community dots are current locations carried forward only for orientation.');
        setText('communitySummary','28 current locations carried forward — orientation only');
        setText('mapSubtitle','2050 projection: Northern Stressed; Central Critical; Southern Severe. Current community locations are muted and no present-day hotspot or data-center layer is projected forward.');
      }else if(isProjection){
        setText('healthDescriptor',year+' projection-step working index — not percent of water remaining');
        setText('yearContext',year+' is an intermediate Tracker projection step between the 2026 present-day view and the 2050 anchor scenario. Present-day hotspot and data-center layers remain hidden, and community locations are carried forward only for orientation.');
        setText('communitySummary','28 current locations carried forward — orientation only');
        setText('mapSubtitle',year+' projection step: use this as a bridge between the four anchor years, not as a measured future condition.');
      }
      requestAnimationFrame(fitTimelineForMobile);
    };

    const communityLayer=doc.getElementById('community-layer');
    if(communityLayer){
      normalizeCommunityLayer();
      const observer=new MutationObserver(()=>{normalizeCommunityLayer();applyYearPresentation()});
      observer.observe(communityLayer,{childList:true});
    }
    const yearLabel=doc.getElementById('sliderYear');
    if(yearLabel){
      const observer=new MutationObserver(applyYearPresentation);
      observer.observe(yearLabel,{childList:true,characterData:true,subtree:true});
    }
    win.addEventListener('resize',fitTimelineForMobile);
    window.addEventListener('resize',fitTimelineForMobile);

    if(typeof win.setTimelineYear==='function')win.setTimelineYear(1950);
    else doc.querySelector('.year-btn[data-year="1950"]')?.click();
    applyYearPresentation();
    setTimeout(fitTimelineForMobile,80);
  }catch(e){
    console.warn('Version 3 shell could not adjust embedded map chrome or V3 presentation refinements.',e);
  }
});
</script>
</body>
</html>
