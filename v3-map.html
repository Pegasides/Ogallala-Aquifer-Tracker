<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Version 3 Interactive Timeline — Ogallala Aquifer Tracker</title>
<style>
:root{--night:#06131d;--panel:#0d2536;--ink:#f7fbff;--muted:#b9ccd8;--aqua:#5eead4;--line:rgba(188,218,235,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.v3bar{height:58px;background:#071a27;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:5}
.v3inner{width:min(1180px,calc(100% - 24px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;font-size:13px;color:#dffcf7;text-decoration:none;white-space:nowrap}
.links{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.links a{color:#e8f2f6;text-decoration:none;border:1px solid #3b596c;background:#102b3d;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.links a:hover,.links a.active{border-color:var(--aqua);background:#123c43;color:#e7fffb}
.context{height:34px;background:#0a202f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--muted);font-size:11px;text-align:center}
.context strong{color:var(--aqua)}
.frame-wrap{height:calc(100vh - 92px);min-height:560px;background:#243442}
iframe{display:block;width:100%;height:100%;border:0;background:#243442}
@media(max-width:760px){
 .v3bar{height:auto;min-height:58px;padding:8px 0}
 .v3inner{display:block}
 .brand{display:block;margin-bottom:7px;font-size:11px}
 .links{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
 .links::-webkit-scrollbar{display:none}
 .links a{flex:0 0 auto}
 .context{height:auto;min-height:36px;padding:7px 12px}
 .frame-wrap{height:calc(100vh - 116px);min-height:520px}
}
</style>
</head>
<body>
<nav class="v3bar" aria-label="Version 3 primary navigation">
  <div class="v3inner">
    <a class="brand" href="v3.html">OGALLALA AQUIFER TRACKER · VERSION 3</a>
    <div class="links">
      <a href="v3.html">V3 Home</a>
      <a class="active" href="v3-map.html">Interactive Timeline</a>
      <a href="index.html">My Aquifer</a>
      <a href="groundwater-window.html">Groundwater Window</a>
    </div>
  </div>
</nav>
<div class="context"><strong>Version 3 timeline:</strong>&nbsp; use the year buttons or slider below. The older map-page header/navigation is hidden here so the experience stays inside Version 3.</div>
<div class="frame-wrap">
  <iframe id="timelineFrame" src="v3-timeline.html" title="Ogallala Aquifer Version 3 interactive timeline"></iframe>
</div>
<script>
const frame=document.getElementById('timelineFrame');
frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    if(!doc)return;
    const header=doc.querySelector('header');
    const nav=doc.querySelector('nav');
    if(header)header.style.display='none';
    if(nav)nav.style.display='none';
    doc.documentElement.style.scrollBehavior='smooth';

    // V3-only presentation refinements. Keep the underlying timeline data untouched.
    if(!doc.getElementById('v3-shell-refinements')){
      const style=doc.createElement('style');
      style.id='v3-shell-refinements';
      style.textContent=`
        body.v3-year-1950 .community-marker{
          opacity:.55;
          width:8px;
          height:8px;
          background:#dbeafe!important;
          border-color:#64748b;
          box-shadow:0 0 0 1px rgba(255,255,255,.14);
        }
        body.v3-year-1950 .community-marker:hover{
          opacity:1;
          width:14px;
          height:14px;
        }
      `;
      doc.head.appendChild(style);
    }

    // Preserve the Tracker's original 28-community set in the V3 experience:
    // Portales, NM is a community marker; Hereford, TX remains a separate 2026 data-center example.
    const normalizeCommunityLayer=()=>{
      const layer=doc.getElementById('community-layer');
      if(!layer)return;
      const hereford=[...layer.querySelectorAll('.community-marker')].find(marker=>
        (marker.title||'').startsWith('Hereford, TX')
      );
      if(!hereford)return;

      const portales={name:'Portales',state:'NM',basin:'Southern',lat:34.1753553,lon:-103.3565191,x:105,y:433};
      const pos=typeof win.getPoint==='function'?win.getPoint(portales):portales;
      const marker=hereford.cloneNode(false);
      marker.style.left=pos.x+'px';
      marker.style.top=pos.y+'px';
      marker.title='Portales, NM — Southern Basin reference community';
      marker.addEventListener('click',()=>{
        if(typeof win.showTooltip==='function'){
          win.showTooltip(marker,"<strong>Portales, NM</strong><br><span style='color:#475569'>Southern Basin reference community.</span>");
        }
      });
      hereford.replaceWith(marker);
    };

    const applyYearPresentation=()=>{
      const year=Number((doc.getElementById('sliderYear')?.textContent||'').trim());
      const is1950=year===1950;
      doc.body.classList.toggle('v3-year-1950',is1950);

      if(is1950){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(descriptor)descriptor.textContent='Predevelopment baseline working index — not percent of water remaining';
        if(context)context.textContent='1950 is the Tracker baseline: 100 is a comparison index, not a claim that 100% of the aquifer remains today. All three basin zones are shown Healthy. Community dots are modern reference locations retained only to orient the viewer.';
        if(summary)summary.textContent='28 modern reference locations — orientation only';
        if(subtitle)subtitle.textContent='1950 baseline: all three basin zones Healthy; modern community locations are muted and retained only for geographic orientation.';
      }
    };

    const communityLayer=doc.getElementById('community-layer');
    if(communityLayer){
      normalizeCommunityLayer();
      const observer=new MutationObserver(()=>{
        normalizeCommunityLayer();
        applyYearPresentation();
      });
      observer.observe(communityLayer,{childList:true});
    }

    const yearLabel=doc.getElementById('sliderYear');
    if(yearLabel){
      const yearObserver=new MutationObserver(applyYearPresentation);
      yearObserver.observe(yearLabel,{childList:true,characterData:true,subtree:true});
    }
    applyYearPresentation();
  }catch(e){
    console.warn('Version 3 shell could not adjust embedded map chrome or V3 presentation refinements.',e);
  }
});
</script>
</body>
</html>
