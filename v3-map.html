<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Version 3 Interactive Timeline — Ogallala Aquifer Tracker</title>
<style>
:root{--night:#06131d;--panel:#0d2536;--ink:#f7fbff;--muted:#b9ccd8;--aqua:#5eead4;--line:rgba(188,218,235,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.v3bar{height:58px;background:#071a27;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:5}
.v3inner{width:min(1180px,calc(100% - 24px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;font-size:13px;color:#dffcf7;text-decoration:none;white-space:nowrap}
.links{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.links a{color:#e8f2f6;text-decoration:none;border:1px solid #3b596c;background:#102b3d;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.links a:hover,.links a.active{border-color:var(--aqua);background:#123c43;color:#e7fffb}
.context{height:34px;background:#0a202f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--muted);font-size:11px;text-align:center}
.context strong{color:var(--aqua)}
.frame-wrap{height:calc(100vh - 92px);min-height:560px;background:#243442}
iframe{display:block;width:100%;height:100%;border:0;background:#243442}
@media(max-width:760px){
 .v3bar{height:auto;min-height:58px;padding:8px 0}
 .v3inner{display:block}
 .brand{display:block;margin-bottom:7px;font-size:11px}
 .links{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
 .links::-webkit-scrollbar{display:none}
 .links a{flex:0 0 auto}
 .context{height:auto;min-height:36px;padding:7px 12px}
 .frame-wrap{height:calc(100vh - 116px);min-height:520px}
}
</style>
</head>
<body>
<nav class="v3bar" aria-label="Version 3 primary navigation">
  <div class="v3inner">
    <a class="brand" href="v3.html">OGALLALA AQUIFER TRACKER · VERSION 3</a>
    <div class="links">
      <a href="v3.html">V3 Home</a>
      <a class="active" href="v3-map.html">Interactive Timeline</a>
      <a href="index.html">My Aquifer</a>
      <a href="groundwater-window.html">Groundwater Window</a>
    </div>
  </div>
</nav>
<div class="context"><strong>Version 3 timeline:</strong>&nbsp; four anchor years tell the main story; the slider adds intermediate projection steps between 2026 and 2050.</div>
<div class="frame-wrap">
  <iframe id="timelineFrame" src="v3-timeline.html" title="Ogallala Aquifer Version 3 interactive timeline"></iframe>
</div>
<script>
const frame=document.getElementById('timelineFrame');
frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    if(!doc)return;
    const header=doc.querySelector('header');
    const nav=doc.querySelector('nav');
    if(header)header.style.display='none';
    if(nav)nav.style.display='none';
    doc.documentElement.style.scrollBehavior='smooth';

    // V3-only presentation refinements. Keep the underlying timeline data untouched.
    if(!doc.getElementById('v3-shell-refinements')){
      const style=doc.createElement('style');
      style.id='v3-shell-refinements';
      style.textContent=`
        body.v3-year-1950 .community-marker{
          opacity:.55;
          width:8px;
          height:8px;
          background:#dbeafe!important;
          border-color:#64748b;
          box-shadow:0 0 0 1px rgba(255,255,255,.14);
        }
        body.v3-year-1950 .community-marker:hover{
          opacity:1;
          width:14px;
          height:14px;
        }
        body.v3-year-1980 .community-marker,
        body.v3-projection .community-marker{
          opacity:.7;
          width:9px;
          height:9px;
          background:#dbeafe!important;
          border-color:#64748b;
          box-shadow:0 0 0 1px rgba(255,255,255,.16);
        }
        body.v3-year-1980 .community-marker:hover,
        body.v3-projection .community-marker:hover{
          opacity:1;
          width:15px;
          height:15px;
        }
        body.v3-year-2026 .side-stack>.summary-card:first-child{
          border-color:#5eead4;
          box-shadow:0 16px 38px rgba(0,0,0,.32),0 0 0 1px rgba(94,234,212,.12);
        }
        body.v3-year-2026 .side-stack>.summary-card:first-child h3{
          color:#dffff9;
        }
        body.v3-year-2026 #hotspotNote{
          background:#352513;
          border-color:#d9982f;
          color:#fff3d0;
        }
        body.v3-year-2026 #facilityPanel .facility{
          background:#12232d;
          border-color:#3d5260;
        }
        body.v3-year-2026 .summary-row strong{
          max-width:58%;
          text-align:right;
        }
        .tick-row span:nth-child(1),
        .tick-row span:nth-child(2),
        .tick-row span:nth-child(3),
        .tick-row span:nth-child(8){
          color:#e7f5fb;
          font-weight:900;
        }
        .tick-row span:nth-child(4),
        .tick-row span:nth-child(5),
        .tick-row span:nth-child(6),
        .tick-row span:nth-child(7){
          opacity:.55;
          font-size:9px;
        }
        #v3-index-caption{
          margin-top:4px;
          color:#9fb6c4;
          font-size:10px;
          font-weight:800;
          letter-spacing:.03em;
          text-transform:uppercase;
        }
        #v3-timeline-hint{
          margin:6px 0 0;
          color:#9fb6c4;
          font-size:10px;
          text-align:center;
        }
      `;
      doc.head.appendChild(style);
    }

    const summaryHealthForCaption=doc.getElementById('summaryHealth');
    if(summaryHealthForCaption && !doc.getElementById('v3-index-caption')){
      const caption=doc.createElement('div');
      caption.id='v3-index-caption';
      caption.textContent='Tracker working index · comparison scale, not percent water remaining';
      summaryHealthForCaption.insertAdjacentElement('afterend',caption);
    }
    const tickRow=doc.querySelector('.tick-row');
    if(tickRow && !doc.getElementById('v3-timeline-hint')){
      const hint=doc.createElement('p');
      hint.id='v3-timeline-hint';
      hint.textContent='Bold dates are anchor years. 2030–2045 are intermediate projection steps.';
      tickRow.insertAdjacentElement('afterend',hint);
    }

    // Preserve the Tracker's original 28-community set in the V3 experience:
    // Portales, NM is a community marker; Hereford, TX remains a separate 2026 data-center example.
    const normalizeCommunityLayer=()=>{
      const layer=doc.getElementById('community-layer');
      if(!layer)return;
      const hereford=[...layer.querySelectorAll('.community-marker')].find(marker=>
        (marker.title||'').startsWith('Hereford, TX')
      );
      if(!hereford)return;

      const portales={name:'Portales',state:'NM',basin:'Southern',lat:34.1753553,lon:-103.3565191,x:105,y:433};
      const pos=typeof win.getPoint==='function'?win.getPoint(portales):portales;
      const marker=hereford.cloneNode(false);
      marker.style.left=pos.x+'px';
      marker.style.top=pos.y+'px';
      marker.title='Portales, NM — Southern Basin reference community';
      marker.addEventListener('click',()=>{
        if(typeof win.showTooltip==='function'){
          win.showTooltip(marker,"<strong>Portales, NM</strong><br><span style='color:#475569'>Southern Basin reference community.</span>");
        }
      });
      hereford.replaceWith(marker);
    };

    const normalizeWorkingIndexDisplay=()=>{
      const summaryHealth=doc.getElementById('summaryHealth');
      const value=(summaryHealth?.textContent||'').replace(/[^0-9.]/g,'');
      if(!value)return;
      summaryHealth.textContent=value;
      const overallStatus=doc.getElementById('overallStatus');
      if(overallStatus)overallStatus.textContent='Tracker working index: '+value;
      const healthBarLabel=doc.getElementById('healthBarLabel');
      if(healthBarLabel)healthBarLabel.textContent=healthBarLabel.textContent.replace('%','');
    };

    const applyYearPresentation=()=>{
      const year=Number((doc.getElementById('sliderYear')?.textContent||'').trim());
      const is1950=year===1950;
      const is1980=year===1980;
      const is2026=year===2026;
      const is2050=year===2050;
      const isProjection=year>2026;
      const isAnchor=is1950||is1980||is2026||is2050;
      doc.body.classList.toggle('v3-year-1950',is1950);
      doc.body.classList.toggle('v3-year-1980',is1980);
      doc.body.classList.toggle('v3-year-2026',is2026);
      doc.body.classList.toggle('v3-projection',isProjection);
      normalizeWorkingIndexDisplay();

      const sliderMode=doc.getElementById('sliderMode');
      if(sliderMode)sliderMode.textContent=isAnchor?(is2050?'Anchor projection':'Anchor year'):'Projection step';

      const summaryCards=[...doc.querySelectorAll('.side-stack>.summary-card')];
      const summaryHeading=summaryCards[0]?.querySelector('h3');
      const facilityHeading=doc.getElementById('facilityPanel')?.parentElement?.querySelector('h3');
      const sourceNote=doc.querySelector('.source-note');
      if(summaryHeading)summaryHeading.textContent='Selected-year dashboard';
      if(facilityHeading)facilityHeading.textContent='2026 digital-infrastructure context';
      if(sourceNote)sourceNote.textContent='Tracker working indices communicate change over time; they are not USGS percentages of remaining aquifer water. The four anchor indices are 100, 85, 60, and 40, with intermediate projection steps between 2026 and 2050.';

      if(is1950){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(descriptor)descriptor.textContent='Predevelopment baseline working index — not percent of water remaining';
        if(context)context.textContent='1950 is the Tracker baseline: 100 is a comparison index, not a claim that 100% of the aquifer remains today. All three basin zones are shown Healthy. Community dots are modern reference locations retained only to orient the viewer.';
        if(summary)summary.textContent='28 modern reference locations — orientation only';
        if(subtitle)subtitle.textContent='1950 baseline: all three basin zones Healthy; modern community locations are muted and retained only for geographic orientation.';
      }else if(is1980){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(descriptor)descriptor.textContent='Early-decline working index — not percent of water remaining';
        if(context)context.textContent='1980 marks the early-decline comparison point: the Tracker working index is 85, with the Northern Basin shown Good and the Central and Southern basins shown Declining. Community dots are modern reference locations, not an historical monitoring network.';
        if(summary)summary.textContent='28 modern reference locations — orientation only';
        if(subtitle)subtitle.textContent='1980 early decline: Northern Good; Central and Southern Declining. Modern community locations are muted so basin-scale change remains the focus.';
      }else if(is2026){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const hotspot=doc.getElementById('hotspotSummary');
        const dc=doc.getElementById('dcSummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(summaryHeading)summaryHeading.textContent='2026 — What matters now';
        if(facilityHeading)facilityHeading.textContent='Infrastructure context — not attribution';
        if(descriptor)descriptor.textContent='Present-day working index — not percent of water remaining';
        if(context)context.textContent='Present-day view: Northern Stable, Central Stressed, Southern Critical. Community dots show Tracker locations; red rings show regional >150-ft decline context and are not city-specific measurements.';
        if(summary)summary.textContent='28 current tracker communities';
        if(hotspot)hotspot.textContent='Regional context — parts of TX / OK / KS';
        if(dc)dc.textContent='3 verified examples — context only';
        if(subtitle)subtitle.textContent='Present-day basin conditions first, followed by community reference points, regional >150-ft decline context, and three verified infrastructure examples.';
      }else if(is2050){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(descriptor)descriptor.textContent='2050 Tracker scenario index — not percent of water remaining';
        if(context)context.textContent='2050 is a Tracker scenario, not a measured future condition: the working index is 40, with the Northern Basin shown Stressed, Central Critical, and Southern Severe. Present-day hotspot and data-center layers stay hidden, and community dots are current locations carried forward only for orientation.';
        if(summary)summary.textContent='28 current locations carried forward — orientation only';
        if(subtitle)subtitle.textContent='2050 projection: Northern Stressed; Central Critical; Southern Severe. Current community locations are muted and no present-day hotspot or data-center layer is projected forward.';
      }else if(isProjection){
        const descriptor=doc.getElementById('healthDescriptor');
        const context=doc.getElementById('yearContext');
        const summary=doc.getElementById('communitySummary');
        const subtitle=doc.getElementById('mapSubtitle');
        if(descriptor)descriptor.textContent=year+' projection-step working index — not percent of water remaining';
        if(context)context.textContent=year+' is an intermediate Tracker projection step between the 2026 present-day view and the 2050 anchor scenario. Present-day hotspot and data-center layers remain hidden, and community locations are carried forward only for orientation.';
        if(summary)summary.textContent='28 current locations carried forward — orientation only';
        if(subtitle)subtitle.textContent=year+' projection step: use this as a bridge between the four anchor years, not as a measured future condition.';
      }
    };

    const communityLayer=doc.getElementById('community-layer');
    if(communityLayer){
      normalizeCommunityLayer();
      const observer=new MutationObserver(()=>{
        normalizeCommunityLayer();
        applyYearPresentation();
      });
      observer.observe(communityLayer,{childList:true});
    }

    const yearLabel=doc.getElementById('sliderYear');
    if(yearLabel){
      const yearObserver=new MutationObserver(applyYearPresentation);
      yearObserver.observe(yearLabel,{childList:true,characterData:true,subtree:true});
    }

    // Enter the Version 3 story at its baseline rather than dropping viewers into the middle.
    if(typeof win.setTimelineYear==='function')win.setTimelineYear(1950);
    else doc.querySelector('.year-btn[data-year="1950"]')?.click();
    applyYearPresentation();
  }catch(e){
    console.warn('Version 3 shell could not adjust embedded map chrome or V3 presentation refinements.',e);
  }
});
</script>
</body>
</html>
