<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Timeline — Ogallala Aquifer Tracker Version 3.4</title>
<style>
:root{--bg:#06131d;--ink:#f7fbff;--aqua:#5eead4;--line:#3e5c6d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.nav{background:#071a27;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.navin{width:min(1180px,calc(100% - 24px));margin:auto;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:9px 0;flex-wrap:wrap}.brand{font-weight:900;color:#dffcf7;text-decoration:none;font-size:13px}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:#eef7fb;text-decoration:none;background:#102b3d;border:1px solid #3b596c;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800}.links a:hover,.links a.active{border-color:var(--aqua);background:#123c43}.context{text-align:center;background:#0a202f;border-bottom:1px solid #244557;color:#a9c0cc;padding:7px 12px;font-size:11px}.context strong{color:var(--aqua)}.shell{width:min(1448px,100%);margin:auto;padding:0 0 28px}.stage{position:relative;width:100%;background:#04111a}.stage img{display:block;width:100%;height:auto}.hit,.playHit{position:absolute;z-index:10;background:transparent;border:0;cursor:pointer;color:transparent;padding:0}.hit:focus-visible,.playHit:focus-visible{outline:3px solid #fff;outline-offset:1px}.sliderHit{position:absolute;z-index:11;left:3.1%;top:72.1%;width:91.4%;height:3.7%;opacity:.001;cursor:pointer}.status{width:min(1180px,calc(100% - 24px));margin:10px auto 0;text-align:center;color:#9fb8c5;font-size:11px}.dc-layer{position:absolute;inset:0;z-index:8;pointer-events:none}.dc-marker{--dc:#5eead4;position:absolute;width:0;height:0;padding:0;border:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--dc);background:transparent;filter:drop-shadow(0 0 2px #001018) drop-shadow(0 0 2px var(--dc));transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}.dc-marker[data-status="construction"]{--dc:#ffad0a}.dc-marker[data-status="proposed"]{--dc:#c678e8}.dc-marker:focus-visible{outline:2px solid #fff;outline-offset:5px}.dc-marker:hover,.dc-marker:focus{z-index:4;filter:drop-shadow(0 0 2px #001018) drop-shadow(0 0 5px var(--dc));transform:translate(-50%,-50%) scale(1.25)}.dc-card{position:absolute;z-index:20;width:min(270px,48vw);padding:9px 11px;border:1px solid var(--dc);border-radius:8px;background:rgba(4,17,26,.97);box-shadow:0 8px 24px rgba(0,0,0,.45);color:#eef7fb;font-size:11px;line-height:1.35;pointer-events:none;transform:translate(10px,-50%)}.dc-card strong{display:block;color:var(--dc);font-size:12px;margin-bottom:2px}.dc-card span{color:#a9c0cc}.dc-card[hidden]{display:none}.dc-key{display:inline-flex;gap:10px;align-items:center;margin-left:8px;vertical-align:middle}.dc-key span{white-space:nowrap}.dc-key i{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid currentColor;margin-right:3px}.dc-key .operational{color:#5eead4}.dc-key .construction{color:#ffad0a}.dc-key .proposed{color:#c678e8}
@media(max-width:760px){.navin{display:block}.brand{display:block;margin-bottom:7px}.links{overflow-x:auto;flex-wrap:nowrap}.links a{white-space:nowrap}}

.teaser-mode .links a:not(.active){display:none}.teaser-mode .links a.active{pointer-events:none;cursor:default}.teaser-mode .brand{pointer-events:none}.teaser-mode .context{display:none}
</style>
</head>
<body><script>if(new URLSearchParams(location.search).get("mode")==="teaser")document.body.classList.add("teaser-mode");</script>
<nav class="nav"><div class="navin"><a class="brand" href="v3.4-home.html">OGALLALA AQUIFER TRACKER · VERSION 3.4</a><div class="links"><a href="v3.4-home.html">V3.4 Home</a><a class="active" href="v3.4-map.html">Interactive Timeline</a><a href="v3.4-data-centers.html">AI Data Centers</a><a href="v3.4-groundwater-window.html">Groundwater Window</a><a href="v3.4-my-aquifer.html">My Aquifer</a><a href="v3.4-sources.html">Sources</a></div></div></nav>
<div class="context"><strong>Version 3.4 Interactive Timeline:</strong> exact approved master artwork for each year.</div>
<main class="shell"><div class="stage" id="stage"><img id="yearImage" src="approved-timeline-images/2026.png" alt="Ogallala Aquifer Tracker approved 2026 timeline view">
<div class="dc-layer" id="dcLayer" aria-label="AI data center locations"></div><div class="dc-card" id="dcCard" hidden></div>
<button class="hit" data-i="0" aria-label="Show 1950" style="left:3.1%;top:66.8%;width:10.2%;height:4.5%"></button>
<button class="hit" data-i="1" aria-label="Show 1980" style="left:14.2%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="2" aria-label="Show 2026" style="left:25.5%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="3" aria-label="Show 2030" style="left:36.6%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="4" aria-label="Show 2035" style="left:47.7%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="5" aria-label="Show 2040" style="left:58.8%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="6" aria-label="Show 2045" style="left:69.9%;top:66.8%;width:10%;height:4.5%"></button>
<button class="hit" data-i="7" aria-label="Show 2050" style="left:80.2%;top:66.8%;width:8.5%;height:4.5%"></button>
<button class="playHit" id="play" aria-label="Play timeline" style="left:88.2%;top:66.8%;width:10%;height:4.5%"></button>
<input class="sliderHit" id="slider" type="range" min="0" max="7" step="1" value="2" aria-label="Timeline year">
</div><div class="status" id="status">Approved master: 2026</div></main>
<script>
const years=[1950,1980,2026,2030,2035,2040,2045,2050];
const img=document.getElementById('yearImage'),slider=document.getElementById('slider'),status=document.getElementById('status'),play=document.getElementById('play'),dcLayer=document.getElementById('dcLayer'),dcCard=document.getElementById('dcCard');
// Percentage coordinates are calibrated to the approved artwork. The base PNG
// remains unchanged; later years can reuse these same facility records.
const dataCenters=[
 {name:'Duos Edge AI — Amarillo',place:'Potter County, Texas',status:'operational',relation:'On or near the aquifer',x:39.1,y:45.2},{name:'Duos Edge AI — Hereford',place:'Deaf Smith County, Texas',status:'operational',relation:'Over the aquifer',x:37.7,y:47.0},{name:'Duos Edge AI — Lubbock',place:'Lubbock County, Texas',status:'operational',relation:'Over the aquifer',x:40.8,y:54.5},{name:'Duos Edge AI — Dumas',place:'Moore County, Texas',status:'operational',relation:'Over the aquifer',x:40.6,y:40.3},{name:'Microsoft — Cheyenne campuses',place:'Cheyenne, Wyoming',status:'operational',relation:'Northern border region',x:27.9,y:19.8},{name:'Meta — Sarpy Campus',place:'Sarpy County, Nebraska',status:'operational',relation:'Eastern regional site',x:52.0,y:25.6},
 {name:'Project Matador — Fermi America',place:'Carson / Potter County area, Texas',status:'construction',relation:'Over the aquifer',x:41.0,y:44.2},{name:'Google–Crusoe Goodnight / Project Llano',place:'Armstrong County, Texas',status:'construction',relation:'Over the aquifer',x:42.2,y:44.9},{name:'Google — Haskell campuses (2)',place:'Haskell County, Texas',status:'construction',relation:'Southern border region',x:43.5,y:60.1},{name:'Google–Intersect Meitner',place:'Gray / Roberts Counties, Texas',status:'construction',relation:'Over the aquifer',x:43.0,y:41.8},{name:'Project Caprock — Aligned',place:'Abernathy, Hale County, Texas',status:'construction',relation:'Over the aquifer',x:40.3,y:51.8},{name:'Meta — Cheyenne',place:'Cheyenne, Wyoming',status:'construction',relation:'Northern border region',x:29.1,y:20.7},{name:'Meta — Tulsa',place:'Tulsa / Catoosa, Oklahoma',status:'construction',relation:'Eastern regional border',x:50.9,y:56.0},{name:'Vantage Frontier',place:'Shackelford County, Texas',status:'construction',relation:'Southern border region',x:45.2,y:61.4},
 {name:'Project Jade / Cheyenne AI Factory',place:'Laramie County, Wyoming',status:'proposed',relation:'Paused / on hold in northern border region',x:27.2,y:21.1},{name:'Microsoft — Cheyenne expansion',place:'Cheyenne, Wyoming',status:'proposed',relation:'Northern border region',x:28.6,y:18.7},{name:'Beltline',place:'Yukon, Canadian County, Oklahoma',status:'proposed',relation:'Eastern aquifer-border region',x:49.8,y:57.3},{name:'Google — Wilbarger County campus',place:'Wilbarger County, Texas',status:'proposed',relation:'Southeast regional border',x:47.0,y:57.8},{name:'Black Pearl — Cipher / AWS conversion',place:'Winkler County, Texas',status:'proposed',relation:'Operational site; AI conversion underway near southwest border',x:32.4,y:60.0}
];
const statusLabel={operational:'Operational',construction:'Under construction',proposed:'Proposed / paused'};
let current=2,running=false,timer=null;
function displayStatus(dc,year){return year>=2035&&dc.status==='construction'?'operational':dc.status;}
function renderDataCenters(year){dcLayer.replaceChildren();dcCard.hidden=true;if(year<2030)return;dataCenters.forEach(dc=>{const markerStatus=displayStatus(dc,year),forecast=year>=2035?' forecast':'';const b=document.createElement('button');b.className='dc-marker';b.dataset.status=markerStatus;b.style.left=dc.x+'%';b.style.top=dc.y+'%';b.setAttribute('aria-label',dc.name+', '+statusLabel[markerStatus]+forecast);b.addEventListener('click',e=>{e.stopPropagation();const right=dc.x>43;dcCard.style.setProperty('--dc',getComputedStyle(b).getPropertyValue('--dc'));dcCard.style.left=(right?dc.x-1:dc.x)+'%';dcCard.style.top=dc.y+'%';dcCard.style.transform=right?'translate(-100%,-50%)':'translate(10px,-50%)';dcCard.innerHTML='<strong>'+dc.name+'</strong>'+dc.place+'<br><span>'+statusLabel[markerStatus]+forecast+' · '+dc.relation+'</span>';dcCard.hidden=false;});dcLayer.appendChild(b)});}
function show(i){current=Math.max(0,Math.min(7,Number(i)));const y=years[current];img.src='approved-timeline-images/'+y+'.png';img.alt='Ogallala Aquifer Tracker approved '+y+' timeline view';slider.value=current;renderDataCenters(y);const counts=y===2030?[6,8,5]:y>=2035?[14,0,5]:null;status.innerHTML='Approved master: '+y+(counts?' · 19 mapped locations <span class="dc-key"><span class="operational"><i></i>'+counts[0]+' operational'+(y>=2035?' forecast':'')+'</span>'+(counts[1]?'<span class="construction"><i></i>'+counts[1]+' construction</span>':'')+'<span class="proposed"><i></i>'+counts[2]+' proposed/paused</span></span>':'');}
document.getElementById('stage').addEventListener('click',()=>{dcCard.hidden=true});
document.querySelectorAll('.hit').forEach(b=>b.addEventListener('click',()=>{running=false;clearTimeout(timer);show(b.dataset.i)}));
slider.addEventListener('input',e=>{running=false;clearTimeout(timer);show(e.target.value)});
play.addEventListener('click',()=>{running=!running;clearTimeout(timer);if(!running)return;const advance=()=>{if(!running)return;show((current+1)%years.length);timer=setTimeout(advance,1500)};advance();});
show(2);
</script>
</body></html>
